async function record(key){
 if(recordPending){notify('Mikrofon izni bekleniyor.');return}
 if(recordKey===key){stopRecording();return}
 if(recordKey){notify('Önce devam eden kaydı bitir.');return}
 if(!navigator.mediaDevices?.getUserMedia||typeof MediaRecorder==='undefined'){notify('Bu tarayıcı mikrofon kaydını desteklemiyor. Telefonunun ses kaydedicisini kullanabilir veya sesli prova yapabilirsin.');return}
 stopSpeech();recordPending=true;const originView=view,originLesson=lessonId,originTab=tab,originPhase=assessmentPhase;
 try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});if(view!==originView||lessonId!==originLesson||tab!==originTab||assessmentPhase!==originPhase){stream.getTracks().forEach(t=>t.stop());return}recordStream=stream;const chunks=[];const r=new MediaRecorder(stream);recorder=r;recordKey=key;r.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};r.onstop=()=>{clearTimeout(recordTimer);stream.getTracks().forEach(t=>t.stop());if(recordings.has(key))URL.revokeObjectURL(recordings.get(key).url);const mime=r.mimeType||chunks[0]?.type||'audio/webm';const blob=new Blob(chunks,{type:mime});recordings.set(key,{url:URL.createObjectURL(blob),ext:mime.includes('mp4')?'m4a':mime.includes('ogg')?'ogg':'webm'});recordKey=null;recorder=null;recordStream=null;refreshRecordBox(key)};r.onerror=()=>{notify('Kayıt sırasında sorun oluştu. Tekrar deneyebilir veya sesli prova yapabilirsin.');stopRecording()};r.start();recordTimer=setTimeout(stopRecording,90000);refreshRecordBox(key)}catch(e){if(recordStream)recordStream.getTracks().forEach(t=>t.stop());recordStream=null;recordKey=null;recorder=null;notify('Mikrofon açılamadı. İzni ve cihaz bağlantısını kontrol et. Kayıt yapmadan da sesli çalışabilirsin.')}finally{recordPending=false}
}

function speakingPanel(l){return `<div class="warm" style="margin-bottom:20px"><strong>Hedef: sesli bir deneme.</strong> Her görevi önce yardımsız dene. Gerekirse modeli aç. Sonra kendi bilgilerinle yeniden söyle. Ses kaydı isteğe bağlıdır; konuşma işaretleri senin beyanına dayanır.</div>${l.speaks.map(([prompt,model],i)=>`<article class="card speak-task"><p class="badge">KONUŞMA ${i+1} / 3</p><h3>${esc(prompt)}</h3><details><summary>Yardıma ihtiyacım var · modeli göster</summary><p class="english" lang="en" style="font-size:25px">${esc(model)}</p>${sayButton(model)}</details>${recordUI('lesson-'+l.id+'-'+i)}<label class="checkline"><input class="check" type="checkbox" data-spoken="${i}" ${(state.spoken[l.id]||[])[i]?'checked':''}>Bu görevi sesli denedim ve modelle karşılaştırdım.</label></article>`).join('')}<article class="card" style="border:2px solid #819366"><p class="badge">GERÇEK HAYAT GÖREVİ</p><h2>Ekranın dışına taşı.</h2><p>${l.mission}</p><label class="checkline"><input class="check" type="checkbox" id="mission" ${state.missions[l.id]?'checked':''}>Bu görevi sesli tamamladım.</label><p class="small muted" style="margin-top:15px">Kayıtlar sayfa açıkken tutulur. Saklamak istediğin kaydı indir. Sayfayı kapatınca indirilmeyen kayıtlar kaybolur. Program ses kaydını bir sunucuya göndermez.</p></article>`}
function optionsFor(w,l){const wrong=shuffled([...new Set(l.words.map(x=>x[1]).filter(x=>x!==w[1]))]).slice(0,2);return shuffled([w[1],...wrong])}
function makeQuiz(l){const wordItems=[l.words[1],l.words[Math.floor(l.words.length/2)]];const qs=wordItems.map(w=>({type:'choice',prompt:`“${w[0]}” ne demek?`,options:optionsFor(w,l),answer:w[1],explain:`${w[0]} = ${w[1]}.`}));for(const q of l.quiz)qs.push({type:'choice',prompt:q[0],options:shuffled(q[1]),answer:q[1][q[2]],explain:q[3]});qs.push({type:'listen',prompt:'Dinle. Hangi anlamı duydun?',audio:l.listen[0],options:shuffled(l.listen[1]),answer:l.listen[1][l.listen[2]],explain:`${l.listen[0]} = ${l.listen[1][l.listen[2]]}`});const tokens=l.build[0].split(' ').map((text,id)=>({text,id}));let mixed=shuffled(tokens);if(mixed.every((t,i)=>t.id===i))mixed.push(mixed.shift());qs.push({type:'build',prompt:l.build[1],answer:l.build[0],tokens:mixed,explain:l.build[0]});return {lesson:l.id,qs,index:0,score:0,answered:false,selected:null,correct:false,chosen:[],finished:false,transcript:false}}
function quizPanel(l){if(!quiz||quiz.lesson!==l.id)return `<article class="card"><p class="badge">HATIRLA · KONTROL ET</p><h2>Altı küçük soru.</h2><p>2 kelime, 2 kullanım sorusu, 1 dinleme ve 1 cümle kurma. Her cevaptan sonra açıklamayı oku. Hedef 6 sorudan en az 5 doğru. İstediğin kadar yeniden deneyebilirsin.</p>${state.quizzes[l.id]?`<div class="soft"><strong>En iyi sonuç: ${state.quizzes[l.id].best}/6</strong> · Son deneme: ${state.quizzes[l.id].last}/6 · ${state.quizzes[l.id].attempts} deneme</div>`:''}<button class="primary" style="margin-top:20px" data-action="start-quiz">Kontrolü başlat →</button></article>`;
 if(quiz.finished)return `<article class="card"><span class="badge">KONTROL TAMAMLANDI</span><div class="result">${quiz.score}<span class="muted" style="font-size:25px"> / 6</span></div><h2>${quiz.score>=5?'Güzel bir adım daha.':'Bir tekrar daha yapalım.'}</h2><p>${quiz.score>=5?'Kontrol hedefini geçtin. Dersin diğer görevlerini de tamamladığında ders işaretlenecek.':'Kelimeler ve kalıplara dön; sonra yeniden dene. Yanlış cevaplar, neyi tekrar edeceğini gösterir.'}</p>${checklist(l)}<div class="row" style="margin-top:23px"><button data-action="start-quiz">Yeniden dene</button><button data-tab="4">Konuşma görevlerine dön</button></div></article>`;
 const q=quiz.qs[quiz.index];return `<article class="card"><div class="row between"><span class="badge">SORU ${quiz.index+1} / 6</span><span class="small muted">${quiz.score} doğru</span></div><div class="meter"><div style="width:${quiz.index/6*100}%"></div></div><h2 style="font-size:27px">${esc(q.prompt)}</h2>${q.type==='listen'?`<div class="row">${sayButton(q.audio,'▶ Cümleyi dinle')}<button class="text-btn small" data-action="transcript">${quiz.transcript?'Metin açık':'Ses yoksa metni göster'}</button></div>${quiz.transcript?`<p class="soft english" lang="en" style="font-size:24px;margin-top:15px">${esc(q.audio)}</p><p class="small muted">Metin desteğiyle bu soru okuma alıştırması olur.</p>`:''}`:''}${q.type==='build'?`<p class="muted">Türkçe anlamına göre İngilizce cümleyi kur. Kelimelere sırayla dokun; üstteki bir kelimeye dokunarak geri al.</p><div class="answer-zone">${quiz.chosen.map(id=>`<button data-remove-token="${id}" ${quiz.answered?'disabled':''}>${esc(q.tokens.find(t=>t.id===id).text)}</button>`).join('')}</div><div class="tokens">${q.tokens.map(t=>`<button data-token="${t.id}" ${quiz.chosen.includes(t.id)||quiz.answered?'disabled':''}>${esc(t.text)}</button>`).join('')}</div><button class="primary" style="margin-top:20px" data-action="check-build" ${quiz.answered||quiz.chosen.length!==q.tokens.length?'disabled':''}>Cümleyi kontrol et</button>`:`<div class="options">${q.options.map((o,i)=>`<button class="option ${quiz.answered&&o===q.answer?'correct':''} ${quiz.answered&&quiz.selected===i&&o!==q.answer?'incorrect':''}" data-answer="${i}" ${quiz.answered?'disabled':''}>${esc(o)}</button>`).join('')}</div>`}${quiz.answered?`<div class="feedback ${quiz.correct?'':'bad'}" role="status"><strong>${quiz.correct?'✓ Doğru.':'Birlikte düzeltelim.'}</strong> ${esc(q.explain)}</div><button class="primary" style="margin-top:18px" data-action="next-question">${quiz.index===5?'Sonucu gör':'Sonraki soru →'}</button>`:''}</article>`}
function answer(correct,selected){if(!quiz||quiz.answered)return;quiz.answered=true;quiz.correct=correct;quiz.selected=selected;if(correct)quiz.score++;renderMain()}
function finishQuiz(){quiz.finished=true;const prev=state.quizzes[lessonId];state.quizzes[lessonId]={best:Math.max(prev?.best||0,quiz.score),last:quiz.score,attempts:(prev?.attempts||0)+1};save();render()}
function reviewPage(){if(!reviewQueue.length||reviewPos>=reviewQueue.length){const due=dueWords();const started=Object.keys(state.review).length;return `<p class="eyebrow">BAKMA · HATIRLA · SONRA KONTROL ET</p><h1>Kelime tekrarım.</h1><p class="goal">Önce Türkçeden İngilizceye hatırla. Sonra sesi dinle ve kendini değerlendir. “Hatırladım” dersen tekrar aralığı 1, 3, 7 ve 14 güne çıkar; zorlanırsan yarın yeniden gelir.</p><div class="grid2"><article class="card"><p class="badge">BUGÜN</p><div class="result">${due.length}</div><h3>kelime veya ifade tekrar bekliyor</h3><p class="muted">${reviewCount?`Bu turda ${reviewCount} kart çalıştın. `:''}${started?'Kısa bir tur en fazla 12 karttır.':'İlk dersin kelimelerini çalışınca kutun dolmaya başlayacak.'}</p><button class="primary" data-action="start-review" ${!due.length?'disabled':''}>Zamanı gelenlerle başla</button>${started?'<button style="margin:10px 0 0 10px" data-action="practice-review">Çalıştıklarımı karıştır</button>':''}</article><article class="card"><h2>Ezber değil, geri çağırma.</h2><ol class="step-list"><li>Türkçe anlamı gör. İngilizcesini sesli söyle.</li><li>Cevabı aç ve model sesi dinle.</li><li>Unuttuysan “Tekrar gerekli”, hatırladıysan “Hatırladım” seç.</li><li>Kelimeyi kısa bir cümlede kullan.</li></ol><p class="small muted" style="margin-top:20px">Değerlendirme sana aittir. Kart sayıları bir dil seviyesi veya kesin kelime bilgisi ölçümü değildir.</p></article></div>`}
 const w=reviewQueue[reviewPos];return `<p class="eyebrow">KELİME TEKRARI · ${reviewPos+1} / ${reviewQueue.length}</p><h1>Aklına geliyor mu?</h1><article class="card"><div class="vocab-card"><p class="small muted">İNGİLİZCESİNİ SESLİ SÖYLE</p><h2>${esc(w.tr)}</h2>${reviewShown?`<p class="english large" lang="en">${esc(w.en)}</p>${sayButton(w.en)}`:'<button class="primary" data-action="show-review">Cevabı göster</button>'}</div>${reviewShown?'<div class="row" style="margin-top:20px"><button data-rate-review="0">Tekrar gerekli</button><button class="primary" data-rate-review="1">Hatırladım ve söyledim</button></div>':''}<div class="row between" style="margin-top:22px"><span class="small muted">Ders ${w.lesson} · Bir cümlede kullanmayı da dene.</span><button class="text-btn" data-action="end-review">Turu bitir</button></div></article>`}
function rateReview(ok){const w=reviewQueue[reviewPos];const prev=state.review[w.key]||{level:0};const level=ok?Math.min(4,prev.level+1):0;const days=ok?[0,1,3,7,14][level]:1;state.review[w.key]={level,due:Date.now()+days*86400000};reviewCount++;reviewPos++;reviewShown=false;save();render()}
function glossaryPage(){return `<p class="eyebrow">ÖĞRENDİKLERİN HEP ELİNİN ALTINDA</p><h1>Sözlüğüm.</h1><p class="goal">${allWords.length} farklı kelime ve ifade. Türkçe veya İngilizce ara, sesi dinle, tekrar kutuna ekle.</p><div class="search"><input type="search" id="wordSearch" aria-label="Türkçe veya İngilizce kelime ara" placeholder="Örneğin: kahve, coffee…" value="${esc(glossaryFilter)}"><select id="glossaryLesson" aria-label="Derse göre filtrele"><option value="0">Bütün dersler</option>${lessons.map(l=>`<option value="${l.id}" ${glossaryLesson===l.id?'selected':''}>${l.id}. ${l.title}</option>`).join('')}</select></div><div id="glossaryResults">${glossaryResults()}</div>`}
function glossaryResults(){const needle=glossaryFilter.trim().toLocaleLowerCase('tr');const found=allWords.filter(w=>(!glossaryLesson||lessons[glossaryLesson-1].words.some(x=>wordKey(x)===w.key))&&`${w.en} ${w.tr}`.toLocaleLowerCase('tr').includes(needle));return `<p class="small muted" aria-live="polite">${found.length} sonuç</p><div class="glossary-list">${found.map(w=>`<article class="glossary-item"><div class="row between"><strong lang="en">${esc(w.en)}</strong>${sayButton(w.en,'▶')}</div><p>${esc(w.tr)}</p><div class="row between"><button class="text-btn small" data-lesson="${w.lesson}">İlk geçtiği ders: ${w.lesson}</button><button class="play" data-add-review="${esc(w.key)}">${state.review[w.key]?'Bugün tekrar et':'+ Tekrara ekle'}</button></div></article>`).join('')}</div>${!found.length?'<p class="empty">Bu aramayla eşleşen kelime yok. Daha kısa bir kelimeyle dene.</p>':''}`}
function scorePhase(phase){const a=state.assess[phase];return {count:a.filter(v=>v!==null).length,total:a.reduce((s,v)=>s+(v||0),0),independent:a.filter(v=>v===2).length}}
function progressPage(){const b=scorePhase('before'),a=scorePhase('after'),c=completeCount();return `<p class="eyebrow">DÜNÜNLE BUGÜNÜNÜ KARŞILAŞTIR</p><h1>İlerlemem.</h1><div class="stats"><div class="stat"><strong>${c} / 17</strong><span>Tamamlanan ders</span></div><div class="stat"><strong>${learned()}</strong><span>En az iki kez hatırladığını belirttiğin kelime</span></div><div class="stat"><strong>${Object.values(state.spoken).flat().filter(Boolean).length} / 51</strong><span>Denediğini işaretlediğin konuşma görevi</span></div></div><article class="card"><h2>Aynı görevler. İki farklı gün.</h2><p class="muted">İlk gün ve ay sonunda aşağıdaki aynı sekiz görevi yap. Önce yardım almadan dene; sonra gerekiyorsa modele bak. Her görev için 0, 1 veya 2 seç. Bu bir öz değerlendirmedir; resmî seviye sınavı değildir.</p><div class="two-meters">${[['before','Başlangıç',b],['after','Ay sonu',a]].map(([phase,title,s])=>`<div><span class="badge">${title}</span><p class="big" style="margin:10px 0">${s.count===8?s.total:'—'} <span class="small muted">/ 16</span></p><div class="score-bar"><div style="width:${s.total/16*100}%"></div></div><p class="small muted">${s.count}/8 görev değerlendirildi · ${s.independent} yardımsız</p></div>`).join('')}</div>${b.count===8&&a.count===8?`<div class="soft">${a.total>b.total?`Öz değerlendirme puanın ${b.total} → ${a.total} oldu. Yardımsız yaptığın görev sayısı ${b.independent} → ${a.independent}.`:a.total===b.total?'Puanın aynı. Kayıtlarında daha az duraklama veya daha anlaşılır cümleler var mı? Bir sonraki hedefini not et.':'Son puanın daha düşük. Bu tek başına gerileme demek değildir; aynı koşullarda tekrar dene ve zorlandığın görevleri çalış.'}</div>`:''}</article><div class="row section-top"><button data-assessment="before" class="${assessmentPhase==='before'?'primary':''}">1. Başlangıç ölçümü</button><button data-assessment="after" class="${assessmentPhase==='after'?'primary':''}">2. Ay sonu ölçümü</button></div><article class="card"><p class="badge">${assessmentPhase==='before'?'İLK GÜN':'AY SONU'} · 5–10 DAKİKA</p><p><strong>0:</strong> Henüz söyleyemiyorum. <strong>1:</strong> Model veya yardım ile söylüyorum. <strong>2:</strong> Modele bakmadan, anlaşılır biçimde söylüyorum.</p><p class="small muted">Puanını seçmeden önce sesli dene. Modeli açtıysan bu denemeyi yardımlı say. Bir öğretmen veya arkadaşın varsa değerlendirmeyi birlikte yapın.</p>${assessment.map(([p,m],i)=>`<div class="assess-row"><h3>${i+1}. ${esc(p)}</h3><details><summary>Denemeden sonra model cevabı aç</summary><p class="english" lang="en" style="font-size:23px">${esc(m)}</p>${sayButton(m)}</details><div class="rubric" role="group" aria-label="Görev ${i+1} öz değerlendirmesi">${['0 · Henüz değil','1 · Yardımla','2 · Yardımsız'].map((label,v)=>`<button data-assess-index="${i}" data-assess-value="${v}" class="${state.assess[assessmentPhase][i]===v?'selected':''}" aria-pressed="${state.assess[assessmentPhase][i]===v}">${label}</button>`).join('')}</div></div>`).join('')}<div class="divider"></div><h3>Sekiz görevi tek kayıtta dene</h3><p class="small muted">İlk gün ve ay sonu kayıtlarını indirip karşılaştır. Her kayıt en fazla 90 saniye; daha uzun bir prova için telefonunun ses kaydedicisini kullan. Ses dosyaları ilerleme yedeğine eklenmez.</p>${recordUI('assessment-'+assessmentPhase)}<label for="assessmentNote" style="display:block;margin:22px 0 8px">${assessmentPhase==='before'?'Bugün zorlandığım şey / hedefim':'Fark ettiğim ilerleme / gelecek ayın hedefi'}</label><textarea id="assessmentNote" maxlength="4000" placeholder="Türkçe yazabilirsin. Notun otomatik kaydedilir.">${esc(state.notes[assessmentPhase])}</textarea></article><article class="card section-top"><h2>Ders durumum</h2>${lessons.map(l=>`<div class="phrase"><div><strong>${l.id}. ${l.title}</strong><p class="small muted">${done(l)?'Tamamlandı':`${(state.seen[l.id]||[]).length}/${l.words.length} kelime · ${(state.spoken[l.id]||[]).filter(Boolean).length}/3 konuşma · kontrol ${state.quizzes[l.id]?.best??'—'}/6`}</p></div><button class="play" data-lesson="${l.id}">Aç →</button></div>`).join('')}</article>`}
function guidePage(){return `<p class="eyebrow">SIFIRDAN BAŞLAYANLAR İÇİN</p><h1>Önce rahat bir başlangıç.</h1><p class="goal">Talimatlar Türkçe. İngilizce bilmeden başlayabilirsin. Defter, kulaklık ve günde kısa bir çalışma süresi yeterli.</p><div class="grid2"><article class="card"><h2>İlk 10 dakika</h2><ol class="step-list"><li>Ses ve ayarlarda “Hello” düğmesini dene.</li><li>İlerlemem bölümünde başlangıç görevlerini dene. Hiç söyleyemiyorsan 0 seç; bu normal.</li><li>Ders 1’i aç. Bir kelimeyi dinle ve sesli tekrar et.</li><li>Türkçe anlamı aç. Sonra kelimeyi yeniden söyle.</li><li>“Hello. I’m…” ile kendi adını söyle. İlk cümlen hazır.</li></ol><div class="row" style="margin-top:22px">${sayButton('Hello.','▶ Hello sesini dene')}<button class="primary" data-lesson="1">Ders 1’i aç</button></div></article><article class="card"><h2>Her dersin altı adımı</h2><ol class="step-list"><li><strong>Başla:</strong> Bugünün hedefi ve kısa hatırlama.</li><li><strong>Kelimeler:</strong> Ses, Türkçe anlam ve aktif tekrar.</li><li><strong>Kalıplar:</strong> Kullanabileceğin tam cümleler.</li><li><strong>Diyalog:</strong> Önce dinleme, sonra senin konuşma sıran.</li><li><strong>Konuş:</strong> Üç görev ve gerçek hayat provası.</li><li><strong>Kontrol:</strong> Altı soru ve açıklamalı geri bildirim.</li></ol></article></div><article class="card section-top"><h2>Bir öğretmen veya arkadaşla çalışıyorsanız</h2><p>Önce modeli yavaşça söyleyin. Öğrenci tekrar etsin, sonra tek bir bilgiyi değiştirsin. Diyalogda rolleri değiştirin. Konuşurken her hatada durdurmayın; tur sonunda anlamı etkileyen bir veya iki noktayı birlikte düzeltin.</p><p>Kontrolde 5/6 yeterlidir ama konuşma görevleri ayrıca yapılmalıdır. Sonraki derse geçiş kilitli değildir. Zor gelen bir dersi iki güne yayabilirsiniz.</p><p>Ay sonunda sekiz başlangıç görevini aynı destek koşullarıyla tekrarlayın. “Daha çok cümle kurabiliyor mu, yardım isteyebiliyor mu, daha az modele bakıyor mu?” sorularına bakın.</p></article><div class="grid2 section-top"><article class="card"><h3>Ses ve gizlilik</h3><p>Dinle düğmeleri cihazındaki İngilizce konuşma seslerini kullanır. Kullanılabilir sesler ve çevrimdışı çalışma cihazına göre değişir; bazı sesler internet kullanabilir.</p><p>Mikrofon yalnızca kayıt düğmesine bastığında istenir. Kayıt isteğe bağlıdır; program telaffuz puanı vermez. Kaydını dinleyip modelle karşılaştır. İndirmediğin kayıtlar sayfa kapanınca kaybolur.</p></article><article class="card"><h3>İlerlemeni koru</h3><p>Ders sonuçları bu tarayıcıda saklanır; başka cihazlara kendiliğinden geçmez. Gizli pencere, tarayıcı verilerini silmek veya dosyanın yerini değiştirmek kayıtlara erişimi etkileyebilir.</p><p>Ayarlar bölümünden düzenli yedek indir. Yedeği aynı HTML programına başka cihazda yükleyebilirsin. Ses kayıtlarını ayrıca indir.</p></article></div><article class="card section-top"><h3>Ders tasarımı ve kaynaklar</h3><p>Bu kursun hedefi, kendini tanıtma ve günlük ihtiyaçlar için kısa konuşmalar kurma gibi A1 düzeyindeki iletişim amaçlarıdır. Dersler ve alıştırmalar bu program için özgün olarak hazırlanmıştır. CEFR tarafından onaylanmış bir kurs veya sınav değildir.</p><p class="small"><a href="https://www.coe.int/en/web/common-european-framework-reference-languages/table-1-cefr-3.3-common-reference-levels-global-scale" target="_blank" rel="noopener">Avrupa Konseyi: CEFR düzey tanımları</a> · <a href="https://developer.mozilla.org/en-US/docs/Web/API/Window/speechSynthesis" target="_blank" rel="noopener">Sesli okuma API’si</a> · <a href="https://developer.mozilla.org/en-US/docs/Web/API/MediaDevices/getUserMedia" target="_blank" rel="noopener">Mikrofon desteği</a></p></article>`}
function settingsPage(){return `<p class="eyebrow">KENDİ HIZINDA, KENDİ SESİNLE</p><h1>Ses & ayarlar.</h1><article class="card"><h2>Dinleme ayarları</h2><div class="settings-row"><label for="voiceSelect">İngilizce ses<select id="voiceSelect"><option value="">Otomatik İngilizce ses</option>${voices.map(v=>`<option value="${esc(v.voiceURI)}" ${state.voice===v.voiceURI?'selected':''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('')}</select></label><label for="rateSelect">Okuma hızı<select id="rateSelect">${[[.7,'Çok yavaş'],[.85,'Yavaş · önerilen'],[1,'Normal']].map(([v,t])=>`<option value="${v}" ${state.rate===v?'selected':''}>${t}</option>`).join('')}</select></label></div><div class="row">${sayButton('Hello. My name is Ali. Nice to meet you.','▶ Sesi dene')}<button data-action="stop-speech">Sesi durdur</button></div><p class="small muted" style="margin-top:18px">${voices.length?`${voices.length} İngilizce ses bulundu.`:'Henüz İngilizce ses bulunamadı. Cihazının dil/konuşma ayarlarından İngilizce ses ekle, ardından sayfayı yeniden aç. Metin ve alıştırmalar ses olmadan da kullanılabilir.'} Ses özellikleri tarayıcı ve işletim sistemine bağlıdır. İnternet olmadan ses çalışmayabilir.</p></article><article class="card section-top"><h2>İlerleme yedeği</h2><p>Dersler, notlar, kontrol sonuçları ve tekrar zamanlarını küçük bir dosyaya indir. Ses kayıtları bu yedeğin içinde değildir; her kaydın yanındaki indirme bağlantısını kullan.</p><div class="row"><button class="primary" data-action="export">↓ İlerlememi yedekle</button><label for="importFile">Yedek yükle <input id="importFile" type="file" accept=".json,application/json" style="max-width:100%"></label></div><p class="small muted" style="margin-top:16px">Bir yedek seçtikten sonra ne içerdiğini göreceksin. Onaylarsan mevcut ilerlemenin yerini alır.</p><div id="importPreview"></div></article><article class="card section-top"><h2>Çalışma biçimi</h2><p>Tek bir HTML dosyasıdır; hesap veya kurulum istemez. Ders metinleri ve alıştırmalar internet olmadan çalışır. İlerleme bu tarayıcıda tutulur. Program mikrofon kaydını sunucuya göndermez; sesli okuma, tarayıcının ses hizmetine bağlıdır.</p><p>Dosyayı Edge veya Chrome gibi bir tarayıcıda aç. Mikrofon kullanılamıyorsa telefonunda kayıt yapabilir veya yalnızca sesli prova yapabilirsin. Başka cihaza geçmeden önce yedek indir.</p></article><div class="danger-zone"><button class="text-btn danger" data-action="reset">Bu tarayıcıdaki ilerlemeyi sıfırla</button></div>`}
let pendingImport=null;
function download(content,name,type){const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.view){nav(b.dataset.view);return}
 if(b.dataset.lesson){nav('lesson',Number(b.dataset.lesson));return}
 if(b.dataset.say){speak(b.dataset.say);return}
 if(b.dataset.tab!==undefined){stopSpeech();stopRecording();tab=Number(b.dataset.tab);renderMain();return}
 if(b.dataset.word!==undefined){wordIndex=Number(b.dataset.word);wordShown=false;renderMain();return}
 if(b.dataset.wordStep){wordIndex=Math.max(0,Math.min(lesson().words.length-1,wordIndex+Number(b.dataset.wordStep)));wordShown=false;renderMain();return}
 if(b.dataset.role){stopSpeech();dialogRole=b.dataset.role;renderMain();return}
 if(b.dataset.record){record(b.dataset.record);return}
 if(b.dataset.answer!==undefined){const q=quiz.qs[quiz.index],i=Number(b.dataset.answer);answer(q.options[i]===q.answer,i);return}
 if(b.dataset.token!==undefined){if(!quiz.answered&&!quiz.chosen.includes(Number(b.dataset.token)))quiz.chosen.push(Number(b.dataset.token));renderMain();return}
 if(b.dataset.removeToken!==undefined){quiz.chosen=quiz.chosen.filter(id=>id!==Number(b.dataset.removeToken));renderMain();return}
 if(b.dataset.rateReview!==undefined){rateReview(Number(b.dataset.rateReview));return}
 if(b.dataset.addReview){const k=b.dataset.addReview;state.review[k]={level:0,due:Date.now()};save();renderSidebar();$('#glossaryResults').innerHTML=glossaryResults();notify('Bugünkü tekrar kutuna eklendi.');return}
 if(b.dataset.assessment){assessmentPhase=b.dataset.assessment;nav('progress');return}
 if(b.dataset.assessIndex!==undefined){state.assess[assessmentPhase][Number(b.dataset.assessIndex)]=Number(b.dataset.assessValue);save();const y=window.scrollY;renderMain();window.scrollTo(0,y);return}
 const action=b.dataset.action;
 if(action==='show-word'){wordShown=true;renderMain()}
 if(action==='study-word'){const l=lesson(),arr=state.seen[l.id]||[];if(!arr.includes(wordIndex))arr.push(wordIndex);state.seen[l.id]=arr;const key=wordKey(l.words[wordIndex]);if(!state.review[key])state.review[key]={level:0,due:Date.now()};save();if(wordIndex<l.words.length-1){wordIndex++;wordShown=false}else notify('Son kelimeyi çalıştın. Şimdi kalıplara geçebilirsin.');render()}
 if(action==='play-dialog'){speak(lesson().dialog.filter(d=>dialogRole==='all'||d[0]==='A').map(d=>d[1]).join('\n\n'))}
 if(action==='stop-speech')stopSpeech();
 if(action==='start-quiz'){quiz=makeQuiz(lesson());renderMain()}
 if(action==='transcript'){quiz.transcript=true;renderMain()}
 if(action==='check-build'){const q=quiz.qs[quiz.index];answer(quiz.chosen.map(id=>q.tokens.find(t=>t.id===id).text).join(' ')===q.answer,null)}
 if(action==='next-question'){if(quiz.index===5)finishQuiz();else{quiz.index++;quiz.answered=false;quiz.selected=null;quiz.correct=false;quiz.chosen=[];quiz.transcript=false;renderMain()}}
 if(action==='start-review'||action==='practice-review'){reviewQueue=shuffled(action==='start-review'?dueWords():allWords.filter(w=>state.review[w.key])).slice(0,12);reviewPos=0;reviewShown=false;reviewCount=0;renderMain()}
 if(action==='show-review'){reviewShown=true;renderMain()}
 if(action==='end-review'){reviewQueue=[];reviewPos=0;render()}
 if(action==='export'){download(JSON.stringify(state,null,2),'ilk-cumlem-ilerleme-'+new Date().toISOString().slice(0,10)+'.json','application/json');notify('Yedek dosyan hazırlanıyor. Ses kayıtlarını ayrıca indir.')}
 if(action==='apply-import'&&pendingImport){stopRecording();state=pendingImport;pendingImport=null;lessonId=state.last;quiz=null;reviewQueue=[];save();render();notify('Yedek yüklendi.')}
 if(action==='cancel-import'){pendingImport=null;$('#importPreview').innerHTML='';$('#importFile').value=''}
 if(action==='reset')$('#resetDialog').showModal();
});
document.addEventListener('change',async e=>{const el=e.target;if(el.dataset.day!==undefined){state.days[Number(el.dataset.day)]=el.checked;save();renderMain()}if(el.dataset.spoken!==undefined){state.spoken[lessonId]??=[false,false,false];state.spoken[lessonId][Number(el.dataset.spoken)]=el.checked;save();renderSidebar()}if(el.id==='mission'){state.missions[lessonId]=el.checked;save();renderSidebar()}if(el.id==='dialogTr'){dialogTr=el.checked;renderMain()}if(el.id==='voiceSelect'){state.voice=el.value;save()}if(el.id==='rateSelect'){state.rate=Number(el.value);save()}if(el.id==='glossaryLesson'){glossaryLesson=Number(el.value);$('#glossaryResults').innerHTML=glossaryResults()}if(el.id==='importFile'&&el.files[0]){pendingImport=null;$('#importPreview').innerHTML='';try{if(el.files[0].size>1000000)throw Error('too large');pendingImport=validate(JSON.parse(await el.files[0].text()));$('#importPreview').innerHTML=`<div class="warm"><p>Bu yedekte ${Object.keys(pendingImport.quizzes).length} dersin kontrol sonucu var. Mevcut ilerlemenin yerini alacak.</p><div class="row"><button data-action="apply-import" class="primary">Yedeği yükle</button><button data-action="cancel-import">Vazgeç</button></div></div>`}catch(e){notify('Bu dosya geçerli bir İlk Cümlem yedeği değil. Mevcut ilerlemen korunuyor.');el.value=''}}});
document.addEventListener('input',e=>{if(e.target.id==='wordSearch'){glossaryFilter=e.target.value;$('#glossaryResults').innerHTML=glossaryResults()}if(e.target.id==='assessmentNote'){state.notes[assessmentPhase]=e.target.value;save()}});
$('#menu').addEventListener('click',()=>{const open=$('#sidebar').classList.toggle('open');$('#menu').setAttribute('aria-expanded',String(open))});
$('#cancelReset').onclick=()=>$('#resetDialog').close();
$('#confirmReset').onclick=()=>{stopRecording();stopSpeech();state=fresh();save();quiz=null;reviewQueue=[];reviewCount=0;wordIndex=0;wordShown=false;lessonId=1;pendingImport=null;for(const r of recordings.values())URL.revokeObjectURL(r.url);recordings.clear();$('#resetDialog').close();nav('home');notify('İlerleme sıfırlandı.')};
window.addEventListener('pagehide',()=>{stopRecording();stopSpeech();for(const r of recordings.values())URL.revokeObjectURL(r.url)});
if('speechSynthesis' in window)speechSynthesis.addEventListener('voiceschanged',fillVoices);
fillVoices();render();

const teacherLessons=[
{title:'My first conversation',goal:'Greet someone, give a name, and ask for repetition.',scene:'Meeting a new neighbour.',note:'Teach I’m = I am and What’s = What is as whole chunks. English needs am in I’m Ali; do not ask the learner to analyse grammar terminology yet. Capitalise I.',sound:'Model the gentle breath at the start of hello. Listen before reading: English spelling does not reliably show pronunciation.',review:'Ask for hello, thank you and Again, please without looking.',prompts:['Greet someone and give your own name.','Ask the other person’s name.','Say you do not understand and ask them to speak slowly.'],mission:'Role-play meeting a neighbour twice. First use the screen; then greet, give your name, ask their name and say thank you without looking. Take both roles if working alone.',teach:'Point to yourself: “Hello. I’m [name].” Gesture towards the learner and wait. Model their sentence only if needed. Deliberately speak one line too quickly so they can use “Again, please.”',checks:[['How do you ask someone’s name?','What’s your name? asks a question. My name is… gives your own name.'],['Someone is speaking too fast. What should you say?','Please speak slowly. is the useful request.']]},
{title:'Who am I?',goal:'Say your country, city and occupation.',scene:'Introducing yourself on the first day of a course.',note:'Use I’m + identity or job; I live in + city. A singular occupation takes a/an: a driver, an engineer. Choose a/an by the following sound. I’m Turkish does not take an article.',sound:'In live (the verb), the final /v/ uses the upper teeth and lower lip. Model the verb pronunciation, not the adjective live.',review:'Recall asking a name and asking for repetition from lesson 1.',prompts:['Say where you are from.','Say which city you live in.','Say your occupation or say you are a student.'],mission:'Give a 20-second introduction with greeting, name, country, city and occupation. Use real information where possible; student is available as a practice identity.',teach:'Draw three labels: country, city, job. Model each sentence separately, then join them. Ask “Ankara: city or job?” to check meaning through a choice rather than “Do you understand?”',checks:[['Choose the correct sentence about being an engineer.','I’m an engineer. needs an because engineer starts with a vowel sound.'],['Which question asks where you live?','Where do you live? asks about the place you live, not your origin or occupation.']]},
{title:'Numbers and contact details',goal:'Say an age, dictate phone digits and spell a name.',scene:'Giving contact details when joining a course.',note:'Use I’m + age, not I have + age. Combine tens and units: forty-five. Read phone digits individually. The four-digit example is deliberately not a real phone number. Split this longer lesson over two days.',sound:'For three, lightly put the tongue tip between the teeth and let air pass. Contrast thirTEEN with THIRty in clear citation forms. Teach English letter names separately from their sounds in words.',review:'Give a name, city and occupation without looking.',prompts:['Say your age; change the model number.','Read the digits 0532 individually.','Spell ALI using English letter names.'],mission:'Choose a made-up four-digit number. Dictate it while your partner writes it, then swap. Say your age and spell your name. No real phone number is required.',teach:'Day 1: group 0–10, 11–20, then the tens; point to written digits in a random order. Day 2: demonstrate A–L–I, then the learner’s name. For Turkish letters, practise nearest Latin equivalents; official documents must retain their official spelling.',checks:[['Which number is forty-two?','42: forty is 40 and two is 2.'],['Which question asks someone’s age?','How old are you? asks about age.']]},
{title:'What is this?',goal:'Name a nearby object and identify its owner.',scene:'Looking at objects on a table.',note:'Use This is… and It’s = It is. A singular countable object takes a/an, but a possessive replaces the article: my bag, not a my bag. Ask Is this your…? Answer Yes, it is. / No, it isn’t.',sound:'Round the lips for the initial /w/ in what. Avoid replacing it with /v/.',review:'Count 1–10 and recall Please speak slowly.',prompts:['Point to an object and name it.','Say that an object belongs to you.','Ask whether a bag belongs to the other person.'],mission:'Put five objects on a table. Name each using It’s a… . Then ask your partner Is this your…? three times.',teach:'Use real objects. Point, model, then hide or move one object for a quick recall game. Hold your own phone for my and gesture to the learner for your.',checks:[['Choose the correct sentence about your bag.','This is my bag. Do not place a before my.'],['Give a negative answer to Is this your key?','No, it isn’t. refers back to the object.']]},
{title:'People and family',goal:'Introduce a friend or family member with simple sentences.',scene:'Introducing people in a photograph.',note:'Turkish uses one third-person singular pronoun where English can use he or she. Teach he/his and she/her in these examples. I have expresses possession; two brothers uses plural -s.',sound:'The sh in she is similar to Turkish ş. Contrast he and she clearly.',review:'Point at an object; ask and answer What’s this?',prompts:['Introduce a friend and give their name.','State the occupation of a woman you know.','Say something about a real or imagined family.'],mission:'Introduce three real or imaginary people. For each, say their relationship to you, name and occupation. No private photos are needed.',teach:'Draw two fictional adults and give them names and jobs. Let the learner introduce them before discussing their own family. Avoid assumptions about family circumstances.',checks:[['Choose the sentence for Elif, a woman in this example.','Her name is Elif. uses her for the woman in this scenario.'],['How do you say that you have two brothers?','I have two brothers. Use have for possession and plural brothers after two.']]},
{title:'At the café',goal:'Order a drink, state a preference and ask for the bill.',scene:'Ordering tea and water at a café.',note:'Teach Can I have…? as a polite request. A tea/a coffee can mean one serving when ordering. Use some water. With means including; without means not including.',sound:'Round the lips at the start of water. Finish please with /z/.',review:'Introduce yourself and a friend in one sentence each.',prompts:['Order a tea politely.','Ask for a coffee without milk.','Say you do not want anything else and ask for the bill.'],mission:'Make a home café with tea, coffee and water on a small menu. Make three different orders, each with please or thank you.',teach:'Use cups or a hand-drawn menu. Offer sugar, then model with/without through adding or removing it. Take the server role, then swap.',checks:[['Which phrase asks for no sugar?','Without sugar, please. means the drink should contain no sugar.'],['The server says Anything else? You want nothing more.','No, thank you. is a polite refusal.']]},
{title:'Time to eat',goal:'Order simple food and ask for an ingredient to be left out.',scene:'Choosing lunch from a menu.',note:'Contrast I’d like (I would like: a request) with I like (a general preference). Use some with uncountable bread/rice; a salad can mean a serving. Asking to leave out an ingredient does not communicate a food allergy.',sound:'The ch in chicken is like Turkish ç. Keep the final /z/ in cheese.',review:'Order tea without sugar and coffee with milk.',prompts:['Ask for a salad.','Ask whether a dish is vegetarian.','Name a food you like and a food you dislike.'],mission:'Order two foods and a drink. Add a request to leave out one ingredient. Repeat without looking at the model.',teach:'Create a tiny menu from the target words. Use “I like…” to talk about tastes, then mime ordering and change to “I’d like…”. Ask the learner to identify which one is an order.',checks:[['Which sentence requests soup?','I’d like some soup. is a request. I like soup. describes a preference.'],['Which phrase asks for no meat?','No meat, please. Meat and milk are different words.']]},
{title:'Shopping',goal:'Ask a price, choose a colour and request payment by card.',scene:'Buying a T-shirt in a shop.',note:'How much is this? asks about one item. Put the colour before the noun: a blue shirt. Teach I’ll take it as a shopping chunk. Prices are imaginary practice amounts.',sound:'Model sh and the final t in shirt; contrast shirt and T-shirt.',review:'Recall the tens from twenty to ninety.',prompts:['Ask the price of an item.','Ask for the red T-shirt.','Ask whether you can pay by card.'],mission:'Give three items imaginary prices of 20, 35 and 80 lira. Ask and answer prices. Choose one product, specify its colour and ask to pay by card.',teach:'Place price labels on ordinary objects or drawings. Swap customer and shopkeeper roles. Include a 13/30 or 18/80 listening contrast.',checks:[['How do you say “a shirt that is blue”?','A blue shirt. Colour precedes the noun.'],['It’s thirty lira. What is the price?','30 lira. Thirteen is 13; thirty is 30.']]},
{title:'Days and times',goal:'Use days of the week and tell a simple time.',scene:'Arranging a time to meet a friend.',note:'Use at before a time and on before a day. Days start with capitals. Teach digital-style times first: three fifteen, three thirty. Add in the morning/afternoon/evening. Distinguish 7 a.m. from 7 p.m.',sound:'Wednesday normally has two syllables. Model it rather than sounding out every written letter.',review:'Say three prices and ask the price of an item.',prompts:['Say the current day of the week.','Say the time 10:30.','Say “at seven on Friday”.'],mission:'Write three imaginary appointments. Say the day and time for each. Specify morning or evening for at least one.',teach:'Draw clock faces or write digital times. Point to a day and time together. Confirm meaning by having the learner write the time they hear.',checks:[['Choose the correct phrase for Friday at ten.','At ten on Friday. Use at for the time and on for the day.'],['Which time is three fifteen?','3:15, not 3:50 or 5:30.']]},
{title:'My day',goal:'Describe your own routine in four short sentences.',scene:'Telling a friend about a normal day.',note:'Use I + base verb for routines: I work. Negative: I don’t work. Avoid I am work. Focus on first-person routines here; do not introduce third-person -s yet. Say go home, without to.',sound:'Model get up as two words, then link them smoothly without a long gap. Prioritise clarity over speed.',review:'Say all seven days and identify today.',prompts:['Say what time you get up.','Describe two activities in your day, in order.','Say a day when you do not work.'],mission:'Say four sentences about a normal day, including two times. Repeat the same talk looking only at the times.',teach:'Make a four-point timeline. Write times and draw small cues instead of full sentences. Reduce the written support on the second attempt.',checks:[['Choose the correct sentence about getting up at seven.','I get up at seven. No am is needed before get up.'],['How do you say that you go home?','I go home. Do not insert to before home.']]},
{title:'Things I like',goal:'Express likes and dislikes and ask about interests.',scene:'Finding common interests with a new friend.',note:'Do you like…? takes Yes, I do. / No, I don’t. Teach the supplied activity forms, such as I like swimming. And adds information; but introduces a contrast.',sound:'Model the changing vowel in like. Practise the word, then I like music.',review:'Describe your routine in three sentences and order a drink.',prompts:['Join two things you like using and.','Join a like and a dislike using but.','Ask someone whether they like swimming.'],mission:'Ask a partner three Do you like…? questions and listen to the answers. If alone, play an imaginary person with different interests.',teach:'Make two columns: like / don’t like. Collect the learner’s choices, then ask genuine questions. Have them ask you questions rather than only repeating statements.',checks:[['Give a positive short answer to Do you like music?','Yes, I do. matches the question with do.'],['Choose the correct sentence about enjoying swimming.','I like swimming. uses the activity form taught in this lesson.']]},
{title:'My home and belongings',goal:'Say what is in a room and locate an object.',scene:'Looking for your key at home.',note:'There is introduces one thing; there are introduces more than one. Teach in, on and under with physical objects. The table means the particular table being discussed. Use plural chairs.',sound:'Model the long vowel in room and close the lips for final m. Avoid adding a vowel after the final consonant.',review:'Recall three everyday objects and two colours.',prompts:['Say that there is one object in your room.','Say that there are two chairs.','Say where your phone is.'],mission:'Move a key to three positions and describe each one. Then describe a room with one There is and one There are sentence.',teach:'Place a key in a bag, on a table and under a chair. Give a location and ask the learner to place the object there before producing their own description.',checks:[['How do you say that two chairs are present?','There are two chairs. Use are and the plural noun.'],['Which phrase means inside the bag?','In the bag. In means inside; on means on its surface; under means below it.']]},
{title:'Finding your way',goal:'Ask where a place is and follow short directions.',scene:'Walking to a station in a town.',note:'Excuse me attracts someone’s attention politely; sorry usually apologises. Go and turn give directions. Next to means immediately beside; near does not necessarily mean adjacent.',sound:'The gh in right is silent. Practise the final ft in left without adding a vowel.',review:'Describe one object each with in, on and under.',prompts:['Politely ask where the station is.','Give two steps of directions.','Say that the pharmacy is next to the bank.'],mission:'Draw a bank, pharmacy, station and starting point. Give two-step directions to the station and describe the pharmacy’s position relative to the bank.',teach:'Use a paper map or a toy as the traveller. Ask the learner to trace the route they hear; this checks understanding without requiring a Turkish explanation.',checks:[['What does Turn left mean?','Turn left directs someone to the left, not right or straight ahead.'],['How do you politely attract a stranger’s attention?','Excuse me. is suitable before asking a question.']]},
{title:'Travel and hotels',goal:'Request a ticket and say that you have a hotel reservation.',scene:'Buying a ticket and checking into a hotel.',note:'Use to for a destination: a ticket to Ankara. For two nights gives duration. Single/return are especially common British ticket terms; one-way/round-trip are also used. Practise with fictional identity details.',sound:'Stress the second syllable of hotel and keep the initial h, which is absent from the Turkish word otel.',review:'Ask where the station is and say 8:15.',prompts:['Ask for a single ticket to Ankara.','Ask what time the train is.','State your reservation and name at a hotel.'],mission:'Play two short scenes. First request a ticket and ask the time. Then check into a hotel using a fictional name and number of nights.',teach:'Use a paper ticket and a pretend booking. Model the hotel receptionist’s passport question as language practice; never ask the learner to upload identification.',checks:[['Which phrase expresses a stay of two nights?','For two nights. For expresses the duration.'],['What does single ticket mean here?','A one-way ticket. Return means an outward and return journey.']]},
{title:'I can do it',goal:'Describe abilities and ask for help or repetition.',scene:'Needing help with a task.',note:'Can takes the base verb without to: can drive. Ask Can you drive? Answer Yes, I can. / No, I can’t. Can’t = cannot. Treat requesting clarification as successful communication.',sound:'Can/can’t vary with accent and sentence stress; the final t may be subtle. Model the whole sentence and use cannot when extra clarity is needed.',review:'Recall I don’t understand and Again, please from lesson 1.',prompts:['Say one thing you can do.','Say one thing you cannot do; it can be imaginary.','Ask for help and say you speak a little English.'],mission:'Have a partner say a sentence quickly. Ask politely for repetition and slower speech. Then say two things you can do. If alone, play both roles.',teach:'Use familiar abilities: drive, swim, use a computer. Make a small deliberate communication problem so the learner must request clarification instead of guessing.',checks:[['Choose the correct sentence about being able to drive.','I can drive. Can takes the base form without to or am.'],['Give a negative short answer to Can you swim?','No, I can’t. matches a can question.']]},
{title:'Let’s make a plan',goal:'Invite someone, accept an invitation or decline politely.',scene:'Inviting a friend for coffee.',note:'Let’s + base verb suggests doing something together. Are you free? takes Yes, I am. Sorry, I’m busy is a polite refusal. Use these chunks for plans without a full future-tense lesson.',sound:'Keep the final ts in let’s and the long vowel in meet. Avoid adding a vowel after final consonants.',review:'Give a positive short answer to each: Do you like…? Can you…? Are you…?',prompts:['Ask whether someone is free tomorrow.','Suggest coffee and set a time.','Decline an invitation politely.'],mission:'Make two arrangements conversations. In the first, accept and agree a place and time. In the second, decline politely. Finish both with a goodbye.',teach:'Give the learner a simple diary with one busy and one free day. Make a real choice of time and place. Swap roles so they initiate the invitation.',checks:[['Choose the correct suggestion to meet.','Let’s meet. Use the base verb after let’s.'],['Give a positive answer to Are you free tomorrow?','Yes, I am. matches the question with are.']]},
{title:'Now it’s my turn',goal:'Combine introductions, ordering, asking directions and arranging a meeting.',scene:'Meeting someone in a new town, visiting a café and arranging another meeting.',note:'No new grammar is introduced. Combine familiar short sentences. Pausing and asking for repetition are normal. Model answers are examples; accept suitable personal variations.',sound:'Speak in short meaning groups: Hello. / I’m Ali. / I’m from Türkiye. Pause naturally and prioritise clarity.',review:'Choose five difficult words for review and compare the first and final speaking attempts.',prompts:['Introduce yourself with name, country, city and occupation.','Order a drink, specify a preference and ask for the bill.','Ask where the station is, then suggest meeting tomorrow.'],mission:'Final role-play: introduce yourself with four details, order a drink, ask a price, ask directions, request repetition once, and suggest a meeting tomorrow with a time. Then repeat the eight baseline tasks in Progress.',teach:'Use six cue cards instead of a full script. Let the learner finish the whole conversation before giving feedback. Then repeat once with one less cue. Do the final assessment under comparable conditions to the baseline.',checks:[['You did not understand something. What should you say?','Can you repeat that, please? keeps the conversation going.'],['Suggest meeting at ten tomorrow.','Let’s meet at ten tomorrow. is a suggestion, not a routine or price.']]}
];
const teacherAssessment=['Greet someone and give your name.','Say your country and the city where you live.','Say your age.','Order a tea politely.','Ask the price of an item.','Ask where the station is.','Say you do not understand and ask for repetition.','Suggest meeting tomorrow and give a time.'];
const teacherDays=['Baseline assessment + Lesson 1','Lesson 2','Lesson 3: numbers','Lesson 3: letters + review','Lesson 4','Lesson 5','Review 1–5: introductions','Lesson 6','Lesson 7','Review: café role-play','Lesson 8','Lesson 9','Review: prices and times','Midpoint practice: tasks from 1–9','Lesson 10','Lesson 11','Review: routines and hobbies','Lesson 12','Lesson 13','Review: homes and directions','Checkpoint: 60-second introduction','Lesson 14','Lesson 15','Review: tickets and asking for help','Lesson 16','Review: invite someone for coffee','Mixed review: difficult words','Lesson 17','Final assessment: the same eight tasks','Compare attempts + choose next month’s goal'];

notify=function(message){studentNotify(teacherMode?(teacherText[message]||message):message)};
const teacherSay=text=>`<button class="play" data-say="${esc(text)}" aria-label="Listen: ${esc(text)}">▶ Listen</button>`;
const trSupport=text=>`<p class="small muted" lang="tr">${esc(text)}</p>`;
recordUI=function(key){if(!teacherMode)return studentRecordUI(key);const r=recordings.get(key);return `<div class="rec-box" data-rec-box="${esc(key)}"><div class="row"><button data-record="${esc(key)}" class="play ${recordKey===key?'rec-on':''}">${recordKey===key?'■ Stop recording':'● Record learner'}</button><span class="rec-state">${recordKey===key?'Recording · maximum 90 seconds':r?'Ready: listen and compare with the model.':'Optional · no automatic pronunciation score'}</span></div>${r?`<audio controls src="${r.url}" aria-label="Learner recording"></audio><br><a href="${r.url}" download="ilk-cumlem-${esc(key)}.${r.ext}">↓ Download this recording</a>`:''}</div>`};
function teacherHeader(){document.documentElement.lang=teacherMode?'en':'tr';$('#modeSwitch').textContent=teacherMode?'Student view (TR)':'Teacher (EN)';$('#modeSwitch').setAttribute('aria-label',teacherMode?'Switch to Turkish student view':'Switch to English teacher view');$('.header-note').textContent=teacherMode?'ENGLISH TEACHER VIEW · TURKISH STUDENT SUPPORT':'TÜRKÇEDEN İNGİLİZCEYE · YETİŞKİNLER İÇİN';$('#menu').textContent=teacherMode?'Menu':'Menü';const settings=document.querySelector('header [data-view="settings"]');settings.textContent=teacherMode?'Settings':'Ses & ayarlar';settings.setAttribute('aria-label',teacherMode?'Voice and progress settings':'Ses ve kayıt ayarları');$('.skip').textContent=teacherMode?'Skip to content':'İçeriğe geç';$('#sidebar').setAttribute('aria-label',teacherMode?'Course menu':'Kurs menüsü');$('#resetDialog h2').textContent=teacherMode?'Reset progress?':'İlerlemeyi sil?';$('#resetDialog p').textContent=teacherMode?'This removes lesson results, review schedules and assessments from this browser. Export a backup first if you want to keep them.':'Bu tarayıcıdaki ders sonuçları, tekrar planı ve ölçümler silinecek. Önce bir yedek indirebilirsin.';$('#cancelReset').textContent=teacherMode?'Cancel':'Vazgeç';$('#confirmReset').textContent=teacherMode?'Yes, reset progress':'Evet, ilerlemeyi sil'}
renderSidebar=function(){if(!teacherMode){studentRenderSidebar();return}const items=[['home','Teacher start'],['plan','30-day plan'],['review','Vocabulary review'],['glossary','Vocabulary list'],['progress','Progress & assessment'],['guide','Teaching guide']];$('#sidebar').innerHTML=`<div class="nav-main">${items.map(([v,t])=>`<button data-view="${v}" class="${view===v?'active':''}" ${view===v?'aria-current="page"':''}>${t}${v==='review'?` <span>${dueWords().length}</span>`:''}</button>`).join('')}</div><div class="side-label">17 COMPLETE LESSONS</div><nav class="lesson-nav" aria-label="Lessons">${teacherLessons.map((t,i)=>`<button data-lesson="${i+1}" class="${view==='lesson'&&lessonId===i+1?'active':''}" ${view==='lesson'&&lessonId===i+1?'aria-current="page"':''}><span class="num ${done(lessons[i])?'done':''}">${done(lessons[i])?'✓':String(i+1).padStart(2,'0')}</span>${esc(t.title)}</button>`).join('')}</nav><div class="side-footer">You teach in English.<br>The learner has Turkish support.</div>`};
renderMain=function(){teacherHeader();if(!teacherMode){studentRenderMain();return}const pages={home:teacherHome,plan:teacherPlan,lesson:teacherLesson,review:teacherReview,glossary:teacherGlossary,progress:teacherProgress,guide:teacherGuide,settings:teacherSettings};$('#main').innerHTML=(storageWarning?'<div class="status-note">Browser storage was unavailable or previous progress could not be read. Export a backup from Settings.</div>':'')+pages[view]()+`<footer>English teacher view · The same learner progress is shared with the Turkish student view. <button class="text-btn small" data-view="settings">Backup & settings</button></footer>`};
function teacherHome(){return `<p class="eyebrow">YOUR TEACHING WORKSPACE · IN ENGLISH</p><section class="hero"><div><h1>You teach.<br>They find their voice.</h1><p>You do not need to speak Turkish. Your instructions, lesson notes, activities and answer keys are here in English. The learner’s Turkish explanations remain one click away.</p><div class="row"><button class="accent" data-lesson="${state.last}">Open lesson ${state.last} →</button><button data-view="guide">How to teach this course</button></div></div><div class="hero-aside"><div class="progress-ring" style="--p:${completeCount()/17*100}"><div><strong>${completeCount()} / 17</strong><span class="small">lessons completed</span></div></div><p class="small">One learner’s progress<br>in this browser.</p></div></section><div class="grid2"><article class="card"><h2>Prepare in English.</h2><p>Open a lesson and follow its six teacher tabs. The notes explain the language, the learner’s tasks and the correct quiz answers. Turkish text is labelled as student support beside its English model.</p><p class="warm"><strong>Sharing your screen?</strong> Teacher notes and answer keys are visible on this screen. Switch to <strong>Student view (TR)</strong> before the learner attempts a test.</p></article><article class="card"><h2>Present, then practise.</h2><ol class="step-list"><li>Demonstrate one short English sentence with a gesture or object.</li><li>Let the learner repeat it, then change one detail.</li><li>Use “Present this step” to open the matching student activity.</li><li>Return with “Teacher (EN)”. Progress stays in place.</li></ol><button data-assessment="before" style="margin-top:17px">Run the baseline assessment</button></article></div>`}
function teacherChecklist(l){return `<div class="stack small"><span>${(state.seen[l.id]||[]).length}/${l.words.length} vocabulary cards studied</span><span>${(state.spoken[l.id]||[]).filter(Boolean).length}/3 speaking tasks attempted</span><span>Practical mission: ${state.missions[l.id]?'completed':'not yet completed'}</span><span>Best quiz score: ${state.quizzes[l.id]?.best??'—'}/6 · target 5/6</span></div>`}
function teacherLesson(){const l=lesson(),t=teacherLessons[l.id-1],names=['Plan','Vocabulary','Language','Dialogue','Speaking','Answer key'];return `<div class="lesson-top"><div><p class="eyebrow">TEACHER · LESSON ${l.id} / 17</p><h1>${esc(t.title)}</h1><p class="goal">${esc(t.goal)}</p></div><span class="pill">${done(l)?'✓ Completed':'25–35 minutes'}</span></div><nav class="tabbar" aria-label="Teacher lesson stages">${names.map((n,i)=>`<button data-tab="${i}" class="${tab===i?'active':''}" ${tab===i?'aria-current="step"':''}>${i+1}. ${n}</button>`).join('')}</nav><div class="row between" style="margin-bottom:20px"><span class="small muted">English guidance for you · Turkish support for the learner</span><button class="primary" data-present="${tab}">Present this step to student →</button></div><section class="lesson-panel">${[teacherStart,teacherWords,teacherLanguage,teacherDialogue,teacherSpeaking,teacherKeys][tab](l,t)}</section><div class="row between section-top"><button data-tab="${Math.max(0,tab-1)}" ${tab===0?'disabled':''}>← Previous step</button>${tab<5?`<button data-tab="${tab+1}">Next step →</button>`:l.id<17?`<button data-lesson="${l.id+1}">Lesson ${l.id+1} →</button>`:'<button data-assessment="after">Final assessment →</button>'}</div>`}
function teacherStart(l,t){return `<div class="grid2"><article class="card"><p class="badge">SCENARIO</p><h2>${esc(t.scene)}</h2><p>${esc(t.teach)}</p><ol class="step-list"><li><strong>1–2 min:</strong> Recall: ${esc(t.review)}</li><li><strong>5–8 min:</strong> Model vocabulary. Repeat, then recall with the word hidden.</li><li><strong>5 min:</strong> Teach the phrases. Change one personal detail.</li><li><strong>5 min:</strong> Take role A; invite the learner to take role B. Swap.</li><li><strong>7–10 min:</strong> Run the three speaking prompts and the practical mission.</li><li><strong>3–5 min:</strong> Run the six-question quiz; review errors.</li></ol><p class="small muted">Timing is flexible. Take a second session if needed; do not rush to meet a timer.</p></article><div class="stack"><article class="card"><h3>Language guidance</h3><p>${esc(t.note)}</p></article><article class="card"><h3>Review before moving on</h3>${teacherChecklist(l)}<p class="small muted" style="margin-top:15px">Mark oral work only after an actual attempt. Scores and completion are shared with the student view.</p></article></div></div>`}
function teacherWords(l,t){return `<article class="warm"><h3>Show meaning without translating aloud</h3><p>Use an object, gesture, sketch or example. Say the English word; let the learner read the matching Turkish meaning. Then cover the word and ask for it again.</p><p><strong>Pronunciation focus:</strong> ${esc(t.sound)}</p></article><div class="glossary-list section-top">${l.words.map(([en,tr],i)=>`<article class="glossary-item"><div class="row between"><strong lang="en">${esc(en)}</strong>${teacherSay(en)}</div>${trSupport(tr)}<label class="checkline small"><input type="checkbox" class="check" data-teacher-word="${i}" ${(state.seen[l.id]||[]).includes(i)?'checked':''}> Practised aloud</label></article>`).join('')}</div>${l.id===3?`<article class="card section-top"><h3>English letter names</h3><p>Model A–L–I first. A letter name is not the same as its sound in a word. The Turkish alphabet has letters not present in the English alphabet; use nearest Latin equivalents for this practice, but follow official spelling on documents.</p><div class="alphabet">${'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(c=>`<button data-say="${c}" aria-label="Listen to letter ${c}">${c}</button>`).join('')}</div><p class="small muted">Z is “zed” in British English and “zee” in American English. Both are acceptable.</p></article>`:''}`}
function teacherLanguage(l,t){return `<div class="grid2"><article class="card"><h2>Model → repeat → personalise</h2>${l.phrases.map(([en,tr])=>`<div class="phrase"><div><p class="english" lang="en">${esc(en)}</p>${trSupport(tr)}</div>${teacherSay(en)}</div>`).join('')}</article><div class="stack"><article class="card"><h3>Explain only what is needed</h3><p>${esc(t.note)}</p></article><article class="card"><h3>Listen for this</h3><p>${esc(t.sound)}</p></article><article class="warm"><h3>Check meaning through action</h3><p>Ask the learner to point, choose an object, write a number or act out a request. A nod to “Do you understand?” is not enough evidence.</p></article></div></div>`}
function teacherDialogue(l,t){return `<article class="card"><h2>${esc(t.scene)}</h2><p>Read one A line, then pause for the learner’s B line. First allow reading; on the second attempt hide their model in student view. Do not play all A lines at once during live role-play.</p><div class="row"><button data-present="3" class="primary">Open student role-play</button><button data-action="stop-speech">Stop audio</button></div>${l.dialog.map(([role,en,tr])=>`<div class="bubble ${role==='B'?'b':''}"><div class="row between"><span class="who">${role==='A'?'A · YOU / PARTNER':'B · LEARNER'}</span>${teacherSay(en)}</div><p class="english" lang="en">${esc(en)}</p>${trSupport(tr)}</div>`).join('')}</article>`}
function teacherSpeaking(l,t){return `<div class="warm" style="margin-bottom:20px">Give one prompt at a time. Demonstrate if necessary, but invite a fresh attempt without the model. Accept sensible personal variations. A checked box records an attempt, not certified proficiency.</div>${l.speaks.map(([tr,model],i)=>`<article class="card speak-task"><span class="badge">SPEAKING TASK ${i+1}</span><h3 style="margin-top:12px">${esc(t.prompts[i])}</h3><details><summary>Student’s Turkish instruction</summary>${trSupport(tr)}</details><details><summary>Example response · not the only valid answer</summary><p class="english" lang="en" style="font-size:25px">${esc(model)}</p>${teacherSay(model)}</details>${recordUI('lesson-'+l.id+'-'+i)}<label class="checkline"><input type="checkbox" class="check" data-spoken="${i}" ${(state.spoken[l.id]||[])[i]?'checked':''}> Learner attempted this aloud and compared with the model.</label></article>`).join('')}<article class="card"><p class="badge">PRACTICAL MISSION</p><h2>Use it in a situation.</h2><p>${esc(t.mission)}</p><label class="checkline"><input class="check" id="mission" type="checkbox" ${state.missions[l.id]?'checked':''}> Learner completed this mission aloud.</label><p class="small muted" style="margin-top:15px">Download recordings you want to keep. They are lost when the page closes and are not included in progress backups. Recording is optional.</p></article>`}
function teacherKeys(l,t){const words=[l.words[1],l.words[Math.floor(l.words.length/2)]];return `<article class="card"><p class="badge">TEACHER REFERENCE · DO NOT DISPLAY DURING TESTING</p><h2>Six questions, explained.</h2><p>The student quiz shuffles options, so identify the answer by its text, not its position. Use “Present this step” to run the real quiz. Reading this page does not award points.</p>${words.map(([en,tr],i)=>`<div class="assess-row"><h3>${i+1}. Vocabulary: What does “${esc(en)}” mean?</h3><details><summary>Correct choice</summary><p><strong lang="tr">${esc(tr)}</strong> = ${esc(en)}</p></details></div>`).join('')}${l.quiz.map((q,i)=>`<div class="assess-row"><h3>${i+3}. ${esc(t.checks[i][0])}</h3><details><summary>Answer and explanation</summary><p>${esc(t.checks[i][1])}</p><p class="small">Exact correct choice shown to the student: <strong>${esc(q[1][q[2]])}</strong></p><p class="small muted" lang="tr">Student question: ${esc(q[0])}</p></details></div>`).join('')}<div class="assess-row"><h3>5. Listening: choose the meaning of the spoken sentence.</h3>${teacherSay(l.listen[0])}<details><summary>Transcript and correct choice</summary><p lang="en">${esc(l.listen[0])}</p><p>Matching Turkish choice: <strong lang="tr">${esc(l.listen[1][l.listen[2]])}</strong></p></details><p class="small muted">If you read it aloud, keep the pace clear and allow repetition. If the learner opens the transcript, treat this as supported reading rather than an independent listening result.</p></div><div class="assess-row"><h3>6. Build the English sentence matching the Turkish prompt.</h3><details><summary>Correct word order</summary><p class="english" lang="en" style="font-size:25px">${esc(l.build[0])}</p>${trSupport(l.build[1])}</details></div><p class="soft">Target: at least 5/6. The app scores the exact sentence order in question 6. For open speaking tasks, accept other grammatically correct sentences that communicate the intended meaning.</p></article>`}
function teacherPlan(){return `<p class="eyebrow">FLEXIBLE SCHEDULE</p><h1>Your 30-day plan.</h1><p class="goal">Allow 25–35 minutes on lesson days and 10–15 minutes on review days. Lesson 3 is split across two days. Review days combine due vocabulary with the speaking activity named below.</p><div class="day-grid">${month.map(([,id],i)=>`<article class="day ${state.days[i]?'is-done':''}"><span class="badge">DAY ${i+1}</span><strong>${teacherDays[i]}</strong><button ${id>0?`data-lesson="${id}"`:id===-1?'data-assessment="after"':'data-view="review"'}>${id>0?'Open lesson':id===-1?'Assessment':'Review'}</button><label><input class="check" type="checkbox" data-day="${i}" ${state.days[i]?'checked':''}> Studied today</label></article>`).join('')}</div>`}
function teacherReview(){if(!reviewQueue.length||reviewPos>=reviewQueue.length)return `<p class="eyebrow">RECALL BEFORE REVEALING</p><h1>Vocabulary review.</h1><article class="card"><h2>${dueWords().length} items due</h2><p>The learner sees a Turkish cue and tries to say its English equivalent. You can check the English after the attempt. Self-ratings schedule reviews after 1, 3, 7 and 14 days; forgotten items return tomorrow.</p><div class="row"><button data-action="start-review" class="primary" ${!dueWords().length?'disabled':''}>Review due words</button><button data-action="practice-review" ${!Object.keys(state.review).length?'disabled':''}>Mix studied words</button></div><p class="small muted" style="margin-top:15px">${reviewCount} cards practised this round. Start by studying vocabulary in a lesson if the review box is empty.</p></article>`;const w=reviewQueue[reviewPos];return `<p class="eyebrow">REVIEW ${reviewPos+1} / ${reviewQueue.length}</p><h1>Ask for the English word.</h1><article class="card"><div class="vocab-card"><p class="small">TURKISH CUE FOR THE LEARNER</p><h2 lang="tr">${esc(w.tr)}</h2>${reviewShown?`<p class="english large" lang="en">${esc(w.en)}</p>${teacherSay(w.en)}`:'<button data-action="show-review" class="primary">Reveal English answer</button>'}</div>${reviewShown?'<div class="row" style="margin-top:18px"><button data-rate-review="0">Needs another review</button><button data-rate-review="1" class="primary">Recalled and said aloud</button></div>':''}<button class="text-btn" style="margin-top:20px" data-action="end-review">End review</button></article>`}
glossaryResults=function(){if(!teacherMode)return studentGlossaryResults();const needle=glossaryFilter.trim().toLocaleLowerCase('tr');const found=allWords.filter(w=>(!glossaryLesson||lessons[glossaryLesson-1].words.some(x=>wordKey(x)===w.key))&&`${w.en} ${w.tr}`.toLocaleLowerCase('tr').includes(needle));return `<p class="small muted" aria-live="polite">${found.length} results</p><div class="glossary-list">${found.map(w=>`<article class="glossary-item"><div class="row between"><strong lang="en">${esc(w.en)}</strong>${teacherSay(w.en)}</div>${trSupport(w.tr)}<div class="row between"><button class="text-btn small" data-lesson="${w.lesson}">First taught: lesson ${w.lesson}</button><button class="play" data-add-review="${esc(w.key)}">Review today</button></div></article>`).join('')}</div>${found.length?'':'<p>No matching word. Try a shorter search.</p>'}`};
function teacherGlossary(){return `<p class="eyebrow">ENGLISH MODELS · TURKISH MEANINGS</p><h1>Vocabulary list.</h1><div class="search"><input type="search" id="wordSearch" aria-label="Search English or Turkish vocabulary" placeholder="Search a word…" value="${esc(glossaryFilter)}"><select id="glossaryLesson" aria-label="Filter by lesson"><option value="0">All lessons</option>${teacherLessons.map((t,i)=>`<option value="${i+1}" ${glossaryLesson===i+1?'selected':''}>${i+1}. ${esc(t.title)}</option>`).join('')}</select></div><div id="glossaryResults">${glossaryResults()}</div>`}
function teacherProgress(){const a=scorePhase('before'),b=scorePhase('after');return `<p class="eyebrow">COMPARE LIKE WITH LIKE</p><h1>Progress & assessment.</h1><div class="stats"><div class="stat"><strong>${completeCount()}/17</strong><span>Lessons completed</span></div><div class="stat"><strong>${a.count===8?a.total:'—'}/16</strong><span>Baseline · ${a.count}/8 tasks rated</span></div><div class="stat"><strong>${b.count===8?b.total:'—'}/16</strong><span>Final · ${b.count}/8 tasks rated</span></div></div><article class="card"><h2>The same eight tasks, twice.</h2><p>Ask for an independent attempt before showing a model. You can show the learner the Turkish task to avoid testing their understanding of complex instructions. Apply the same support conditions at the beginning and end.</p><p><strong>0:</strong> Not yet able to respond. <strong>1:</strong> Responds with a model or help. <strong>2:</strong> Gives an understandable response without the model. Personal variations are valid.</p><p class="small muted">This is a practical observation, not a formal A1 exam. Scores are entered by you or the learner, not inferred from audio.</p><div class="row"><button data-assessment="before" class="${assessmentPhase==='before'?'primary':''}">Baseline</button><button data-assessment="after" class="${assessmentPhase==='after'?'primary':''}">End of month</button></div>${assessment.map(([tr,model],i)=>`<div class="assess-row"><h3>${i+1}. ${teacherAssessment[i]}</h3>${trSupport(tr)}<details><summary>Example response · reveal after the attempt</summary><p class="english" lang="en" style="font-size:24px">${esc(model)}</p>${teacherSay(model)}</details><div class="rubric" role="group" aria-label="Assessment for task ${i+1}">${['0 · Not yet','1 · With help','2 · Independent'].map((label,v)=>`<button data-assess-index="${i}" data-assess-value="${v}" class="${state.assess[assessmentPhase][i]===v?'selected':''}" aria-pressed="${state.assess[assessmentPhase][i]===v}">${label}</button>`).join('')}</div></div>`).join('')}${recordUI('assessment-'+assessmentPhase)}<p class="small muted">Maximum 90 seconds per recording. Download it before closing the page; use a phone recorder for a longer attempt.</p><label for="assessmentNote">${assessmentPhase==='before'?'Baseline observations / goals':'Observed progress / next month’s goal'}</label><textarea id="assessmentNote" maxlength="4000" placeholder="Notes save automatically.">${esc(state.notes[assessmentPhase])}</textarea></article><article class="card section-top"><h2>Lesson record</h2>${teacherLessons.map((t,i)=>`<div class="phrase"><div><strong>${i+1}. ${esc(t.title)}</strong><p class="small muted">${done(lessons[i])?'Completed':`${(state.seen[i+1]||[]).length}/${lessons[i].words.length} vocabulary · ${(state.spoken[i+1]||[]).filter(Boolean).length}/3 speaking · quiz ${state.quizzes[i+1]?.best??'—'}/6`}</p></div><button class="play" data-lesson="${i+1}">Open</button></div>`).join('')}</article>`}
function teacherGuide(){return `<p class="eyebrow">YOU DO NOT NEED TO KNOW TURKISH</p><h1>Teach through demonstration.</h1><div class="grid2"><article class="card"><h2>Your first five minutes</h2><ol class="step-list"><li>Open the baseline assessment. Let the learner read the Turkish task and attempt it. Zero is a valid starting point.</li><li>Open lesson 1. Point to yourself and say “Hello. I’m…” using your own name.</li><li>Gesture towards the learner. Wait. If needed, model their response once.</li><li>Use the English teacher instructions to prepare each stage; present the Turkish student activity when ready.</li></ol></article><article class="card"><h2>A routine for every new phrase</h2><ol class="step-list"><li><strong>Show meaning:</strong> use an object, picture, action or short situation.</li><li><strong>Model:</strong> say one natural, short sentence clearly.</li><li><strong>Repeat:</strong> let the learner copy it once or twice.</li><li><strong>Change:</strong> replace the name, item, time or preference.</li><li><strong>Recall:</strong> hide the model and try again.</li></ol></article></div><article class="card section-top"><h2>Useful classroom instructions</h2><p>Say the English and demonstrate the action. The Turkish is here for the learner to read, not for you to pronounce.</p>${[['Listen.','Dinle.'],['Listen and repeat.','Dinle ve tekrar et.'],['Your turn.','Sıra sende.'],['Try again.','Tekrar dene.'],['Look here.','Buraya bak.'],['Choose one.','Birini seç.'],['Say it without looking.','Bakmadan söyle.'],['Ask me.','Bana sor.'],['Take your time.','Acele etme.']].map(([en,tr])=>`<div class="phrase"><div><p class="english" lang="en">${en}</p>${trSupport(tr)}</div>${teacherSay(en)}</div>`).join('')}</article><article class="card section-top"><h2>Correct gently, then repeat.</h2><p>Let the learner finish a speaking turn. Pick one or two errors that affect the message, model the improvement, and invite another attempt. Do not require a native accent. Accept personal information and other correct answers in open speaking tasks.</p><p>If a task is too hard, reduce it to one sentence, offer the model, then remove that support gradually. Do not turn a speaking lesson into a long explanation of English grammar.</p><h3>Shared screen and progress</h3><p>Teacher mode is a view, not a private or password-protected area. Its notes can be seen on a shared screen. “Present this step” keeps the same lesson and opens its student activity. “Teacher (EN)” returns to your guidance. Both modes use the same local learner record; switching modes does not reset it.</p><h3>Audio and recordings</h3><p>Browser speech depends on available device voices. If it fails, read the English model aloud yourself. Recording is optional, has a 90-second limit and does not grade pronunciation. Download recordings separately from the progress backup.</p><h3>What the course demonstrates</h3><p>The aim is useful early communication towards A1. Compare the same eight speaking tasks under similar conditions. Course completion is not a guarantee of full A1 proficiency.</p></article>`}
function teacherSettings(){return `<p class="eyebrow">VOICE, BACKUP AND LOCAL PROGRESS</p><h1>Settings.</h1><article class="card"><h2>English model voice</h2><div class="settings-row"><label for="voiceSelect">Voice<select id="voiceSelect"><option value="">Automatic English voice</option>${voices.map(v=>`<option value="${esc(v.voiceURI)}" ${state.voice===v.voiceURI?'selected':''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('')}</select></label><label for="rateSelect">Speed<select id="rateSelect">${[[.7,'Very slow'],[.85,'Slow · recommended'],[1,'Normal']].map(([v,t])=>`<option value="${v}" ${state.rate===v?'selected':''}>${t}</option>`).join('')}</select></label></div><div class="row">${teacherSay('Hello. My name is Ali. Nice to meet you.')}<button data-action="stop-speech">Stop audio</button></div><p class="small muted" style="margin-top:16px">${voices.length} English voices listed. Playback depends on the device and may require internet. If playback fails, you can read the models aloud.</p></article><article class="card section-top"><h2>Progress backup</h2><p>Export results, review schedules and notes. Audio recordings are not included. Each recording has its own download link.</p><div class="row"><button data-action="export" class="primary">↓ Export progress</button><label for="teacherImport">Import a backup<input type="file" id="teacherImport" accept=".json,application/json"></label></div><div id="teacherImportPreview"></div><p class="small muted">Importing replaces the current learner record only after confirmation. English and Turkish modes share one learner’s local progress.</p></article><article class="card section-top"><h3>Local storage</h3><p>Progress is stored in this browser, not synced between devices. Export a backup before moving the file, changing devices or clearing browser data. Notes and results from the earlier version remain compatible.</p></article><div class="danger-zone"><button class="text-btn danger" data-action="reset">Reset this browser’s learner progress</button></div>`}
function setTeacherMode(mode){stopSpeech();stopRecording();teacherMode=mode;try{localStorage.setItem('ilk-cumlem-mode',mode?'teacher':'student')}catch(e){}render();window.scrollTo(0,0)}
const modeButton=document.createElement('button');modeButton.id='modeSwitch';modeButton.className='play accent';document.querySelector('header>.row').prepend(modeButton);modeButton.addEventListener('click',()=>setTeacherMode(!teacherMode));
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.present!==undefined){e.stopImmediatePropagation();tab=Number(b.dataset.present);setTeacherMode(false)}if(b.dataset.teacherImport==='apply'&&pendingImport){e.stopImmediatePropagation();stopRecording();state=pendingImport;pendingImport=null;lessonId=state.last;quiz=null;reviewQueue=[];save();render();notify('Yedek yüklendi.')}if(b.dataset.teacherImport==='cancel'){e.stopImmediatePropagation();pendingImport=null;$('#teacherImportPreview').innerHTML='';$('#teacherImport').value=''}},true);

function translation(text){const id='translation-'+(++translationSerial);return `<div class="translation-help"><button class="play" data-translation="${id}" aria-expanded="false" aria-controls="${id}" lang="tr">Türkçe</button><p id="${id}" lang="tr" hidden>${esc(text)}</p></div>`}

teacherHeader=function(){document.documentElement.lang='en';$('.header-note').textContent='ENGLISH COURSE · OPTIONAL TURKISH HELP';$('#menu').textContent='Menu';const b=document.querySelector('header [data-view="settings"]');b.textContent='Settings';b.setAttribute('aria-label','Voice and progress settings');$('.skip').textContent='Skip to content';$('#sidebar').setAttribute('aria-label','Course menu');$('#resetDialog h2').textContent='Reset progress?';$('#resetDialog p').textContent='This removes progress from this browser. Export a backup first if you want to keep it.';$('#cancelReset').textContent='Cancel';$('#confirmReset').textContent='Reset progress'};
renderSidebar=function(){const items=[['home','Start'],['plan','30-day plan'],['review','Word review'],['glossary','Word list'],['progress','My progress'],['guide','How to use']];$('#sidebar').innerHTML=`<div class="nav-main">${items.map(([v,n])=>`<button data-view="${v}" class="${view===v?'active':''}">${n}</button>`).join('')}</div><div class="side-label">17 LESSONS</div><nav class="lesson-nav" aria-label="Lessons">${teacherLessons.map((t,i)=>`<button data-lesson="${i+1}" class="${view==='lesson'&&lessonId===i+1?'active':''}"><span class="num ${done(lessons[i])?'done':''}">${done(lessons[i])?'✓':i+1}</span>${esc(t.title)}</button>`).join('')}</nav>`};
