function eslHome(){const next=lessons.find(l=>!done(l))||lessons[16];return `<p class="eyebrow">ENGLISH · START HERE</p><section class="hero"><div><h1>One sentence.<br>One new beginning.</h1><p>Listen, learn and speak. Build your English in 17 lessons.</p><div class="row"><button class="accent" data-lesson="${next.id}">Start lesson ${next.id} →</button><button data-view="plan">My 30-day plan</button></div></div><div class="hero-aside"><div class="progress-ring" style="--p:${completeCount()/17*100}"><div><strong>${completeCount()} / 17</strong><span class="small">lessons complete</span></div></div></div></section><article class="card">${pair('Need help? Click Türkçe next to a word or sentence. Click again to hide the translation.','Yardıma mı ihtiyacın var? Bir kelime veya cümlenin yanındaki Türkçe düğmesine tıkla. Çeviriyi gizlemek için tekrar tıkla.')}<div class="row"><button data-lesson="1" class="primary">Lesson 1</button><button data-assessment="before">Try the first speaking check</button></div></article><div class="stats"><div class="stat"><strong>17</strong><span>complete lessons</span></div><div class="stat"><strong>${allWords.length}</strong><span>words and expressions</span></div><div class="stat"><strong>51</strong><span>speaking tasks</span></div></div>`}
function eslLesson(){const l=lesson(),t=teacherLessons[l.id-1],names=['Start','Words','Phrases','Conversation','Speak','Quiz'];return `<div class="lesson-top"><div><p class="eyebrow">LESSON ${l.id} / 17</p><h1>${esc(t.title)}</h1>${translation(l.title)}${pair(t.goal,l.goal)}</div><span class="pill">${done(l)?'✓ Complete':'25–35 minutes'}</span></div><nav class="tabbar" aria-label="Lesson steps">${names.map((n,i)=>`<button data-tab="${i}" class="${tab===i?'active':''}">${i+1}. ${n}</button>`).join('')}</nav><section class="lesson-panel">${[eslStart,eslWords,eslPhrases,eslDialogue,eslSpeak,eslQuiz][tab](l,t)}</section><div class="row between section-top"><button data-tab="${Math.max(0,tab-1)}" ${tab===0?'disabled':''}>← Back</button>${tab<5?`<button class="primary" data-tab="${tab+1}">Next →</button>`:l.id<17?`<button data-lesson="${l.id+1}">Next lesson →</button>`:'<button data-assessment="after">Final speaking check →</button>'}</div>`}
function eslStart(l,t){return `<div class="grid2"><article class="card"><h2>Today’s situation</h2>${pair(t.scene,l.scene)}${commonInstruction()}<ol class="step-list"><li>Learn the words.</li><li>Practise the phrases.</li><li>Try the conversation.</li><li>Speak about your life.</li><li>Take the quiz.</li></ol>${translation('Kelimeleri öğren. Kalıpları çalış. Konuşmayı dene. Kendi hayatın hakkında konuş. Testi yap.')}<button data-tab="1" class="primary">Start with words →</button></article><article class="card"><h2>Remember</h2>${pair(t.review,l.review)}${teacherChecklist(l)}<details><summary>Teaching tip</summary><p>${esc(t.teach)}</p></details></article></div>`}
function eslWords(l,t){const [en,tr]=l.words[wordIndex];return `<article class="card">${commonInstruction()}<p class="badge">WORD ${wordIndex+1} / ${l.words.length}</p><div class="vocab-card"><h2 class="english large" lang="en">${esc(en)}</h2><p>${esc(definitions[en])}</p><div class="row">${teacherSay(en)}${translation(tr)}</div></div><div class="row between" style="margin-top:18px"><button data-word-step="-1" ${wordIndex===0?'disabled':''}>← Back</button><button class="primary" data-action="study-word">I said it aloud ✓</button><button data-word-step="1" ${wordIndex===l.words.length-1?'disabled':''}>Next →</button></div><div class="word-strip">${l.words.map(([w],i)=>`<button data-word="${i}" class="${i===wordIndex?'selected':''}">${esc(w)}${(state.seen[l.id]||[]).includes(i)?' ✓':''}</button>`).join('')}</div><details><summary>Pronunciation help</summary>${pair(t.sound,l.sound)}</details></article>${l.id===3?`<article class="card section-top"><h2>Letter names</h2>${pair('Listen to the letters. Spell your name.','Harfleri dinle. Adını harf harf söyle.')}<div class="alphabet">${'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(c=>`<button data-say="${c}">${c}</button>`).join('')}</div></article>`:''}`}
function eslPhrases(l,t){return `<div class="grid2"><article class="card">${commonInstruction()}${l.phrases.map(([en,tr])=>`<div class="phrase"><div><p class="english" lang="en">${esc(en)}</p>${translation(tr)}</div>${teacherSay(en)}</div>`).join('')}</article><article class="card"><h2>Language help</h2>${pair(t.note,l.note)}${pair('Change one detail. Say the sentence about you.','Bir bilgiyi değiştir. Cümleyi kendin hakkında söyle.')}</article></div>`}
function eslDialogue(l,t){return `<article class="card"><h2>Let’s talk.</h2>${pair('Read both parts. Then choose “My turn: B” and say the B lines without the model.','İki rolü de oku. Sonra “My turn: B” seç ve B satırlarını modele bakmadan söyle.')}<div class="row"><button data-role="all" class="${dialogRole==='all'?'primary':''}">Show both parts</button><button data-role="B" class="${dialogRole==='B'?'primary':''}">My turn: B</button><button data-action="stop-speech">Stop audio</button></div>${l.dialog.map(([who,en,tr])=>`<div class="bubble ${who==='B'?'b':''}"><span class="who">${who==='A'?'A · PARTNER':'B · YOU'}</span>${dialogRole==='B'&&who==='B'?`<p>Your turn. Say your line.</p>${translation(tr)}<details><summary>Show example</summary><p class="english" lang="en">${esc(en)}</p>${teacherSay(en)}</details>`:`<p class="english" lang="en">${esc(en)}</p><div class="row">${teacherSay(en)}${translation(tr)}</div>`}</div>`).join('')}</article>`}
function eslSpeak(l,t){return `${pair('Try first. Open the example if you need help. Then try again.','Önce dene. Yardım gerekirse örneği aç. Sonra tekrar dene.')}${l.speaks.map(([tr,en],i)=>`<article class="card speak-task"><span class="badge">SPEAK ${i+1} / 3</span>${pair(t.prompts[i],tr)}<details><summary>Show example</summary><p class="english" lang="en" style="font-size:25px">${esc(en)}</p>${teacherSay(en)}</details>${recordUI('lesson-'+l.id+'-'+i)}<label class="checkline"><input class="check" type="checkbox" data-spoken="${i}" ${(state.spoken[l.id]||[])[i]?'checked':''}> I tried this aloud.</label></article>`).join('')}<article class="card"><h2>Your real-life task</h2>${pair(t.mission,l.mission)}<label class="checkline"><input class="check" type="checkbox" id="mission" ${state.missions[l.id]?'checked':''}> I did this task aloud.</label><p class="small muted">Download any recording you want to keep before closing this page.</p></article>`}
makeQuiz=function(l){const t=teacherLessons[l.id-1];const qs=[l.words[1],l.words[Math.floor(l.words.length/2)]].map(w=>({type:'choice',prompt:'Choose the word: '+definitions[w[0]],tr:w[1],options:shuffled([w[0],...shuffled(l.words.filter(x=>x[0]!==w[0]).map(x=>x[0])).slice(0,2)]),answer:w[0],explain:w[0]+' — '+definitions[w[0]]}));l.quiz.forEach((q,i)=>qs.push({type:'choice',prompt:t.checks[i][0],tr:q[0],options:shuffled(q[1].map(o=>englishOption[o]||o)),answer:englishOption[q[1][q[2]]]||q[1][q[2]],explain:t.checks[i][1]}));qs.push({type:'listen',prompt:'Listen. Which sentence do you hear?',tr:'Dinle. Hangi cümleyi duyuyorsun?',audio:l.listen[0],options:shuffled(listeningChoices[l.id-1]),answer:listeningChoices[l.id-1][l.listen[2]],explain:l.listen[0]});let tokens=shuffled(l.build[0].split(' ').map((text,id)=>({text,id})));if(tokens.every((x,i)=>x.id===i))tokens.push(tokens.shift());qs.push({type:'build',prompt:'Put the words in the correct order.',tr:l.build[1],tokens,answer:l.build[0],explain:l.build[0]});return {lesson:l.id,qs,index:0,score:0,answered:false,selected:null,correct:false,chosen:[],finished:false,transcript:false}};
function eslQuiz(l){if(!quiz||quiz.lesson!==l.id)return `<article class="card"><h2>Check your English.</h2>${pair('Six questions. Try for five correct answers. You can try again.','Altı soru var. En az beş doğru cevap hedefle. Tekrar deneyebilirsin.')}<p>Best score: ${state.quizzes[l.id]?.best??'—'}/6</p><button class="primary" data-action="start-quiz">Start quiz →</button></article>`;if(quiz.finished)return `<article class="card"><h2>${quiz.score>=5?'Well done!':'Keep practising.'}</h2><p class="result">${quiz.score}/6</p>${teacherChecklist(l)}<button data-action="start-quiz">Try again</button></article>`;const q=quiz.qs[quiz.index];return `<article class="card"><p class="badge">QUESTION ${quiz.index+1} / 6</p><h2>${esc(q.prompt)}</h2>${translation(q.tr)}${q.type==='listen'?`<div class="row">${teacherSay(q.audio)}<button data-action="transcript">Show transcript</button></div>${quiz.transcript?`<p lang="en">${esc(q.audio)}</p><p class="small muted">Transcript support turns this into a reading exercise.</p>`:''}`:''}${q.type==='build'?`<div class="answer-zone">${quiz.chosen.map(id=>`<button data-remove-token="${id}" ${quiz.answered?'disabled':''}>${esc(q.tokens.find(t=>t.id===id).text)}</button>`).join('')}</div><div class="tokens">${q.tokens.map(t=>`<button data-token="${t.id}" ${quiz.answered||quiz.chosen.includes(t.id)?'disabled':''}>${esc(t.text)}</button>`).join('')}</div><button class="primary" data-action="check-build" ${quiz.answered||quiz.chosen.length!==q.tokens.length?'disabled':''}>Check sentence</button>`:`<div class="options">${q.options.map((o,i)=>`<button class="option ${quiz.answered&&o===q.answer?'correct':''} ${quiz.answered&&quiz.selected===i&&o!==q.answer?'incorrect':''}" data-answer="${i}" ${quiz.answered?'disabled':''}>${esc(o)}</button>`).join('')}</div>`}${quiz.answered?`<div class="feedback ${quiz.correct?'':'bad'}" role="status"><strong>${quiz.correct?'Correct.':'Let’s try that again.'}</strong> ${esc(q.explain)}</div><button data-action="next-question" class="primary" style="margin-top:18px">${quiz.index===5?'See result':'Next question →'}</button>`:''}</article>`}
glossaryResults=function(){const needle=glossaryFilter.trim().toLocaleLowerCase('tr');const found=allWords.filter(w=>(!glossaryLesson||lessons[glossaryLesson-1].words.some(x=>wordKey(x)===w.key))&&`${w.en} ${w.tr}`.toLocaleLowerCase('tr').includes(needle));return `<p>${found.length} words</p><div class="glossary-list">${found.map(w=>`<article class="glossary-item"><strong lang="en">${esc(w.en)}</strong><p>${esc(definitions[w.en])}</p><div class="row">${teacherSay(w.en)}${translation(w.tr)}<button class="play" data-add-review="${esc(w.key)}">Review today</button></div></article>`).join('')}</div>`};
function eslReview(){if(!reviewQueue.length||reviewPos>=reviewQueue.length)return `<article class="card"><h1>Word review.</h1>${pair('Read the clue. Say the word. Then check your answer.','İpucunu oku. Kelimeyi söyle. Sonra cevabını kontrol et.')}<p>${dueWords().length} words due today.</p><div class="row"><button data-action="start-review" ${!dueWords().length?'disabled':''}>Review due words</button><button data-action="practice-review" ${!Object.keys(state.review).length?'disabled':''}>Mix studied words</button></div></article>`;const w=reviewQueue[reviewPos];return `<article class="card"><p class="badge">WORD ${reviewPos+1} / ${reviewQueue.length}</p><h2>${esc(definitions[w.en])}</h2>${translation(w.tr)}${reviewShown?`<p class="english large" lang="en">${esc(w.en)}</p>${teacherSay(w.en)}<div class="row"><button data-rate-review="0">Practise again</button><button data-rate-review="1">I remembered</button></div>`:'<button class="primary" data-action="show-review">Show answer</button>'}<button data-action="end-review" class="text-btn">End review</button></article>`}
function eslProgress(){const before=scorePhase('before'),after=scorePhase('after');return `<h1>My progress.</h1><div class="stats"><div class="stat"><strong>${completeCount()}/17</strong><span>Lessons complete</span></div><div class="stat"><strong>${before.count===8?before.total:'—'}/16</strong><span>First speaking check</span></div><div class="stat"><strong>${after.count===8?after.total:'—'}/16</strong><span>Final speaking check</span></div></div><article class="card">${pair('Try the same eight tasks at the start and end of the month. Try without help first.','Ayın başında ve sonunda aynı sekiz görevi dene. Önce yardım almadan dene.')}<div class="row"><button data-assessment="before" class="${assessmentPhase==='before'?'primary':''}">First check</button><button data-assessment="after" class="${assessmentPhase==='after'?'primary':''}">Final check</button></div>${assessment.map(([tr,en],i)=>`<div class="assess-row">${pair((i+1)+'. '+teacherAssessment[i],tr)}<details><summary>Show example</summary><p lang="en">${esc(en)}</p>${teacherSay(en)}</details><div class="rubric">${['0 · Not yet','1 · With help','2 · Without help'].map((text,v)=>`<button data-assess-index="${i}" data-assess-value="${v}" class="${state.assess[assessmentPhase][i]===v?'selected':''}">${text}</button>`).join('')}</div></div>`).join('')}${recordUI('assessment-'+assessmentPhase)}<label for="assessmentNote">My notes</label><textarea id="assessmentNote" maxlength="4000">${esc(state.notes[assessmentPhase])}</textarea></article>`}
function eslGuide(){return `<h1>How to use this course.</h1><article class="card">${pair('English stays on screen. Click Türkçe beside any lesson item to show its translation. Click again to hide it.','İngilizce ekranda kalır. Bir ders öğesinin yanındaki Türkçe düğmesine tıklayarak çevirisini göster. Gizlemek için tekrar tıkla.')}${pair('Listen, repeat, and say your own sentence. Use an example when you need help.','Dinle, tekrar et ve kendi cümleni söyle. Yardıma ihtiyaç duyduğunda örneği kullan.')}${pair('Complete the words, three speaking tasks, the practical task and at least five quiz questions correctly to complete a lesson.','Dersi tamamlamak için kelimeleri, üç konuşma görevini ve uygulama görevini çalış; testte en az beş doğru cevap ver.')}${pair('Recordings are optional. Download recordings before closing the page. Save a progress backup in Settings.','Kayıt yapmak isteğe bağlıdır. Sayfayı kapatmadan önce kayıtları indir. Ayarlardan ilerleme yedeği al.')}<p>Study for about 25–35 minutes on lesson days and 10–15 minutes on review days. Take more time when needed.</p>${translation('Ders günlerinde yaklaşık 25–35 dakika, tekrar günlerinde 10–15 dakika çalış. Gerekirse daha fazla zaman ayır.')}<p>The course builds early communication skills towards A1. Completion is not a formal language certificate.</p></article>`}
function eslSettings(){return teacherSettings().replace('English and Turkish modes share one learner’s local progress.','Your progress stays the same when you show or hide translations.')}

 form:'This is + noun. / Is this + noun? / Yes, it is. / No, it isn’t.',formTr:'This is + isim. / Is this + isim? / Yes, it is. = Evet. / No, it isn’t. = Hayır, değil.',explain:'Move is before this to make the question. Use a with one object: a pen. Use my or your instead of a when you identify the owner.',explainTr:'Soru yapmak için is sözcüğünü this önüne getir. Tek bir eşya için a kullan: a pen. Sahibini belirtirken a yerine my veya your kullan.',models:[['This is my bag.','Bu benim çantam.'],['Is this your bag?','Bu senin çantan mı?'],['No, it is not.','Hayır, değil.']],error:['Is this a your pen?','Is this your pen?','Do not combine a and your here.','Burada a ve your birlikte kullanılmaz.'],build:[['This is a phone.','Bu bir telefon.'],['This is my bag.','Bu benim çantam.'],['Is this your key?','Bu senin anahtarın mı?'],['Yes, it is.','Evet.'],['No, it is not.','Hayır, değil.'],['What is this?','Bu ne?']],changes:[['Make a question.','This is your pen.','Is this your pen?','Soru yap.'],['Make it negative.','It is my key.','It is not my key.','Olumsuz yap.'],['Change the owner to me.','This is your bag.','This is my bag.','Sahibi ben olacak şekilde değiştir.']],asks:[['What’s this? Point to an object.','Bu ne? Bir eşyayı göster.','It’s a pen.'],['Is this your phone?','Bu senin telefonun mu?','Yes, it is.'],['Is this your key? Answer no.','Bu senin anahtarın mı? Hayır diye cevapla.','No, it isn’t.']],gap:['At lost property, you need your bag and key. Your bag is on the table; the phone is not yours. Ask for your items.','You work at lost property. Show a bag, key and phone one by one. Ask whether each belongs to the customer.'],gapTr:['Kayıp eşya masasındasın; çantanı ve anahtarını arıyorsun. Masadaki çanta senin; telefon senin değil. Eşyalarını iste.','Kayıp eşya görevlisisin. Çanta, anahtar ve telefonu sırayla göster. Her birinin müşteriye ait olup olmadığını sor.'],outcome:'Return the correct two objects. Ask at least two questions and give a negative answer.',outcomeTr:'Doğru iki eşyayı teslim edin. En az iki soru sorun ve bir olumsuz cevap verin.',exit:['Name an object in a full sentence.','Ask if an object belongs to someone.','Give a complete negative short answer.'],exitTr:['Bir eşyayı tam cümleyle adlandır.','Bir eşyanın birine ait olup olmadığını sor.','Tam bir kısa olumsuz cevap ver.'],home:'Choose three objects and practise a statement, question and short answer for each.'
},
{
 form:'He/She is… / His/Her name is… / I have + number + plural noun.',formTr:'He/She is… = O… / His/Her name is… = Onun adı… / I have + sayı + çoğul isim.',explain:'Use he/his for the male example and she/her for the female example. Use is with he and she. After two, say brothers or sisters, with plural -s.',explainTr:'Erkek örneğinde he/his, kadın örneğinde she/her kullan. He ve she ile is gelir. Two sonrasında brothers veya sisters diyerek çoğul -s ekle.',models:[['She is a teacher.','O bir öğretmen.'],['Her name is Elif.','Onun adı Elif.'],['I have two brothers.','İki erkek kardeşim var.']],error:['She a teacher.','She is a teacher.','Keep is in the sentence.','Cümlede is kullan.'],build:[['This is my friend.','Bu benim arkadaşım.'],['Her name is Elif.','Onun adı Elif.'],['She is a teacher.','O bir öğretmen.'],['His name is Ali.','Onun adı Ali.'],['He is a driver.','O bir şoför.'],['I have two sisters.','İki kız kardeşim var.']],changes:[['Change to a woman.','He is a teacher.','She is a teacher.','Kadın için değiştir.'],['Change to two.','I have one brother.','I have two brothers.','İki kişi olacak şekilde değiştir.'],['Make a question.','She is a teacher.','Is she a teacher?','Soru yap.']],asks:[['Who is this? Use a real or imaginary person.','Bu kim? Gerçek veya hayalî bir kişi kullan.','This is my friend.'],['What’s her name?','Onun adı ne?','Her name is Elif.'],['Is she a teacher?','O öğretmen mi?','Yes, she is.']],gap:['Introduce your imaginary friend Elif. She is a teacher. Ask about your partner’s friend.','Introduce your imaginary friend Ali. He is a driver. Ask the other person about Elif’s name and job.'],gapTr:['Hayalî arkadaşın Elif’i tanıt. Elif öğretmen. Eşinin arkadaşını sor.','Hayalî arkadaşın Ali’yi tanıt. Ali şoför. Karşındakine Elif’in adını ve mesleğini sor.'],outcome:'Each person learns the other friend’s name and job, then introduces that friend.',outcomeTr:'Her kişi diğer arkadaşın adını ve mesleğini öğrensin, sonra o arkadaşı tanıtsın.',exit:['Introduce one person in three sentences.','Ask about that person’s job.','Say you have two imaginary brothers or sisters.'],exitTr:['Bir kişiyi üç cümleyle tanıt.','O kişinin mesleğini sor.','İki hayalî erkek veya kız kardeşin olduğunu söyle.'],home:'Describe two imaginary people using name, relationship and job.'
},
{
 form:'Can I have + item, please? / with + ingredient / without + ingredient',formTr:'Can I have + ürün, please? = … alabilir miyim? / with = ile / without = olmadan',explain:'Keep the request frame Can I have…? Change only the item first. Add with milk or without sugar after the drink. Please makes the request polite.',explainTr:'Can I have…? istek kalıbını koru. Önce yalnızca ürünü değiştir. İçecekten sonra with milk veya without sugar ekle. Please isteği kibarlaştırır.',models:[['Can I have a tea, please?','Bir çay alabilir miyim, lütfen?'],['A coffee with milk, please.','Sütlü bir kahve, lütfen.'],['A tea without sugar, please.','Şekersiz bir çay, lütfen.']],error:['Can I a coffee?','Can I have a coffee?','Keep have after Can I.','Can I sonrasında have kullan.'],build:[['Can I have a tea, please?','Bir çay alabilir miyim, lütfen?'],['Can I have a coffee, please?','Bir kahve alabilir miyim, lütfen?'],['A small coffee, please.','Küçük bir kahve, lütfen.'],['Without sugar, please.','Şekersiz olsun, lütfen.'],['No, thank you.','Hayır, teşekkür ederim.'],['The bill, please.','Hesap, lütfen.']],changes:[['Change tea to coffee.','Can I have a tea, please?','Can I have a coffee, please?','Çay yerine kahve kullan.'],['Ask for no sugar.','With sugar, please.','Without sugar, please.','Şekersiz iste.'],['Change large to small.','A large coffee, please.','A small coffee, please.','Büyük yerine küçük kullan.']],asks:[['What would you like?','Ne istersin?','Can I have a tea, please?'],['With sugar?','Şekerli mi?','Without sugar, please.'],['Anything else?','Başka bir şey?','Some water, please.']],gap:['Order a small coffee without sugar and some water. You must tell the server your drink, size and preference.','You are the server. Find out the drink, size and sugar preference. Ask Anything else? and repeat the order back.'],gapTr:['Şekersiz küçük bir kahve ve biraz su sipariş et. İçeceği, boyutu ve tercihini söyle.','Garsonsun. İçeceği, boyutu ve şeker tercihini öğren. Anything else? sorusunu sor ve siparişi tekrar et.'],outcome:'The server repeats the correct order; the customer confirms or corrects it.',outcomeTr:'Garson doğru siparişi tekrar etsin; müşteri onaylasın veya düzeltsin.',exit:['Order a drink politely without a model.','Add one preference to the order.','Respond to Anything else? and ask for the bill.'],exitTr:['Modele bakmadan kibarca içecek sipariş et.','Siparişe bir tercih ekle.','Anything else? sorusuna cevap ver ve hesap iste.'],home:'Make three orders with different drinks and with/without preferences.'
},
{
 form:'I would like… / I like… / I do not like…',formTr:'I would like… = … istiyorum. / I like… = … severim. / I do not like… = … sevmem.',explain:'I would like is a request now; I like is a general preference. Use do not / don’t to make like negative. Keep the verb like unchanged after don’t.',explainTr:'I would like şimdi bir istek belirtir; I like genel bir beğeniyi anlatır. Like ifadesini olumsuz yapmak için do not / don’t kullan. Don’t sonrasında like değişmez.',models:[['I would like a salad.','Bir salata istiyorum.'],['I like chicken.','Tavuğu severim.'],['I do not like fish.','Balık sevmem.']],error:['I not like fish.','I do not like fish.','Add do before not.','Not öncesine do ekle.'],build:[['I would like some soup, please.','Biraz çorba istiyorum, lütfen.'],['I like chicken.','Tavuğu severim.'],['I do not like fish.','Balık sevmem.'],['Is it vegetarian?','Vejetaryen mi?'],['No meat, please.','Et olmasın, lütfen.'],['I would like a salad, please.','Bir salata istiyorum, lütfen.']],changes:[['Make it negative.','I like fish.','I do not like fish.','Olumsuz yap.'],['Make a request, not a general preference.','I like soup.','I would like some soup.','Genel beğeni yerine istek belirt.'],['Change salad to soup.','I would like a salad.','I would like some soup.','Salata yerine çorba kullan.']],asks:[['What would you like to eat?','Ne yemek istersin?','I’d like a salad, please.'],['Do you like fish?','Balık sever misin?','No, I don’t.'],['Would you like some soup?','Biraz çorba ister misin?','Yes, please.']],gap:['Order a vegetarian salad with no cheese and some water. Ask whether the salad is vegetarian before ordering.','You are the server. Your salad is vegetarian and normally has cheese. Soup is available too. Ask what the customer wants and confirm changes.'],gapTr:['Peynirsiz vejetaryen salata ve su iste. Siparişten önce salatanın vejetaryen olup olmadığını sor.','Garsonsun. Salata vejetaryen ama normalde peynir içeriyor. Çorba da var. Müşterinin isteğini sor ve değişiklikleri onayla.'],outcome:'Agree an order with one ingredient left out. Include a preference and a request.',outcomeTr:'Bir malzemesi çıkarılmış siparişte anlaşın. Hem beğeni hem istek cümlesi kullanın.',exit:['Say one food you like and one you dislike.','Order a food using I’d like.','Ask whether a dish is vegetarian.'],exitTr:['Sevdiğin ve sevmediğin birer yiyeceği söyle.','I’d like ile yemek iste.','Bir yemeğin vejetaryen olup olmadığını sor.'],home:'Say two preferences, then make a different order with I’d like.'
},
{
 form:'How much is + item? / adjective + noun / Can I pay by card?',formTr:'How much is + ürün? = … ne kadar? / sıfat + isim / Can I pay by card? = Kartla ödeyebilir miyim?',explain:'Place a colour or size before the noun: a blue shirt, a large T-shirt. Ask How much is this? for one item. Answer with It is + price.',explainTr:'Renk veya boyutu isimden önce kullan: a blue shirt, a large T-shirt. Bir ürün için How much is this? diye sor. It is + fiyat ile cevapla.',models:[['It is a blue shirt.','Bu mavi bir gömlek.'],['How much is this?','Bu ne kadar?'],['It is thirty lira.','Otuz lira.']],error:['I would like a shirt blue.','I would like a blue shirt.','Put blue before shirt.','Blue sözcüğünü shirt önüne koy.'],build:[['I would like a blue shirt.','Mavi bir gömlek istiyorum.'],['How much is this?','Bu ne kadar?'],['It is thirty lira.','Otuz lira.'],['Do you have a large size?','Büyük bedeniniz var mı?'],['Can I pay by card?','Kartla ödeyebilir miyim?'],['I will take it.','Bunu alacağım.']],changes:[['Change blue to red.','I would like a blue shirt.','I would like a red shirt.','Maviyi kırmızı yap.'],['Ask the price.','It is thirty lira.','How much is this?','Fiyatı sor.'],['Change the price to fifty.','It is thirty lira.','It is fifty lira.','Fiyatı elli yap.']],asks:[['What colour would you like?','Hangi rengi istersin?','Blue, please.'],['How much is this?','Bu ne kadar?','It’s fifty lira.'],['Would you like a small or large size?','Küçük mü büyük beden mi istersin?','A large size, please.']],gap:['You want a large blue T-shirt. Ask the price and whether you can pay by card.','You sell blue and black T-shirts for fifty lira. Small and large are available. You accept cards. Ask for colour and size.'],gapTr:['Büyük beden mavi tişört istiyorsun. Fiyatını ve kartla ödeme yapıp yapamayacağını sor.','Mavi ve siyah tişörtleri elli liraya satıyorsun. Küçük ve büyük beden var. Kart kabul ediyorsun. Renk ve bedeni sor.'],outcome:'Agree the exact colour, size, price and payment method.',outcomeTr:'Renk, beden, fiyat ve ödeme yöntemini kesinleştirin.',exit:['Request a product with a colour.','Ask a price and understand the answer.','Ask to pay by card.'],exitTr:['Rengini belirterek bir ürün iste.','Fiyat sor ve cevabı anla.','Kartla ödemeyi sor.'],home:'Put two imaginary prices on objects and role-play buying each one.'
},
{
 form:'It is + time/day. / at + time / on + day',formTr:'It is + saat/gün. / at + saat / on + gün',explain:'Use at for a clock time and on for a day. Say It is ten thirty for 10:30. In arrangements, combine both: at ten on Friday.',explainTr:'Saat için at, gün için on kullan. 10:30 için It is ten thirty de. Plan yaparken ikisini birleştir: at ten on Friday.',models:[['It is ten thirty.','Saat on otuz.'],['It is Friday.','Bugün cuma.'],['At ten on Friday.','Cuma günü saat onda.']],error:['On ten at Friday.','At ten on Friday.','Use at + time and on + day.','At + saat ve on + gün kullan.'],build:[['What time is it?','Saat kaç?'],['It is three thirty.','Saat üç otuz.'],['What day is it?','Bugün günlerden ne?'],['It is Monday.','Bugün pazartesi.'],['At ten on Friday.','Cuma günü saat onda.'],['At seven in the evening.','Akşam saat yedide.']],changes:[['Change the time to 10:30.','It is three thirty.','It is ten thirty.','Saati 10:30 yap.'],['Change Friday to Monday.','At ten on Friday.','At ten on Monday.','Cuma yerine pazartesi kullan.'],['Ask the time.','It is three o’clock.','What time is it?','Saati sor.']],asks:[['What time is it? Use 3:15.','Saat kaç? 3:15 kullan.','It’s three fifteen.'],['What day is it?','Bugün günlerden ne?','It’s Monday.'],['Coffee on Friday? What time?','Cuma kahve? Saat kaçta?','At ten on Friday.']],gap:['You can meet on Friday at ten or Saturday at three. Ask which time works for your partner.','You can meet on Friday at ten, but not Saturday. Ask whether Friday means morning or evening. Choose the morning.'],gapTr:['Cuma saat onda veya cumartesi üçte buluşabilirsin. Eşine hangi zamanın uygun olduğunu sor.','Cuma onda uygunsun ama cumartesi değilsin. Cuma için sabah mı akşam mı olduğunu sor. Sabahı seç.'],outcome:'Confirm one day and time, including morning or evening.',outcomeTr:'Sabah veya akşam bilgisini de vererek bir gün ve saatte anlaşın.',exit:['Say a digital time shown by the teacher.','Name a day and time with on and at.','Ask the time without a model.'],exitTr:['Öğretmenin gösterdiği dijital saati söyle.','On ve at ile gün ve saat belirt.','Modele bakmadan saati sor.'],home:'Write three appointments and say each day and time aloud.'
},
{
 form:'I + verb. / I do not + verb. / Do you + verb? / What time do you + verb?',formTr:'I + fiil. / I do not + fiil. / Do you + fiil? / What time do you + fiil?',explain:'For your routine, use I + base verb. Add do not for a negative. Put Do you before the verb for a yes/no question. This lesson practises I/you, not he/she routines.',explainTr:'Rutinini anlatırken I + yalın fiil kullan. Olumsuz için do not ekle. Evet/hayır sorusu için fiilden önce Do you koy. Bu ders he/she rutinleri yerine I/you kullanır.',models:[['I work on Monday.','Pazartesi çalışırım.'],['I do not work on Sunday.','Pazar çalışmam.'],['Do you work on Sunday?','Pazar çalışır mısın?']],error:['I am go to work.','I go to work.','Do not put am before the routine verb.','Rutin fiilinden önce am koyma.'],build:[['I get up at seven.','Saat yedide kalkarım.'],['I have breakfast at eight.','Saat sekizde kahvaltı yaparım.'],['I go to work at nine.','Saat dokuzda işe giderim.'],['I do not work on Sunday.','Pazar çalışmam.'],['Do you work on Sunday?','Pazar çalışır mısın?'],['What time do you get up?','Saat kaçta kalkarsın?']],changes:[['Make it negative.','I work on Sunday.','I do not work on Sunday.','Olumsuz yap.'],['Ask your partner.','You work on Sunday.','Do you work on Sunday?','Eşine sor.'],['Ask for the time.','You get up at seven.','What time do you get up?','Saati sor.']],asks:[['What time do you get up?','Saat kaçta kalkarsın?','I get up at seven.'],['Do you work on Sunday?','Pazar çalışır mısın?','No, I don’t.'],['What time do you go home?','Saat kaçta eve gidersin?','I go home at six.']],gap:['Your practice day: get up 7, breakfast 8, work 9, home 6. Ask about your partner’s times.','Your practice day: get up 6, breakfast 7, work 8, home 5. Ask about your partner’s times.'],gapTr:['Örnek günün: kalkış 7, kahvaltı 8, iş 9, eve dönüş 6. Eşinin saatlerini sor.','Örnek günün: kalkış 6, kahvaltı 7, iş 8, eve dönüş 5. Eşinin saatlerini sor.'],outcome:'Find two differences between your days. Ask at least three questions each.',outcomeTr:'Günleriniz arasındaki iki farkı bulun. Her kişi en az üç soru sorsun.',exit:['Describe your day in four sentences.','Say one thing you do not do on Sunday.','Ask a routine question with Do you or What time do you.'],exitTr:['Gününü dört cümleyle anlat.','Pazar yapmadığın bir şeyi söyle.','Do you veya What time do you ile rutin sorusu sor.'],home:'Use four clock times as cues and describe your day without full written sentences.'
},
{
 form:'I like + noun/-ing. / I don’t like… / Do you like…? / and / but',formTr:'I like + isim/-ing. / I don’t like… / Do you like…? / and = ve / but = ama',explain:'Use Do you like…? to ask. Answer Yes, I do or No, I don’t, then add a detail. Join similar preferences with and and contrasting ones with but.',explainTr:'Sormak için Do you like…? kullan. Yes, I do veya No, I don’t ile cevapla, sonra bir ayrıntı ekle. Benzer beğenileri and, zıt olanları but ile birleştir.',models:[['I like music and reading.','Müziği ve okumayı severim.'],['I like tea, but I do not like coffee.','Çayı severim ama kahveyi sevmem.'],['Do you like swimming?','Yüzmeyi sever misin?']],error:['Do you like music? Yes, I am.','Do you like music? Yes, I do.','Match do with do in the short answer.','Kısa cevapta do ile do eşleşir.'],build:[['I like music.','Müziği severim.'],['I like reading and walking.','Okumayı ve yürümeyi severim.'],['I do not like football.','Futbolu sevmem.'],['Do you like swimming?','Yüzmeyi sever misin?'],['Yes, I do.','Evet, severim.'],['I like tea, but I do not like coffee.','Çayı severim ama kahveyi sevmem.']],changes:[['Make it negative.','I like football.','I do not like football.','Olumsuz yap.'],['Ask a question.','You like music.','Do you like music?','Soru sor.'],['Join the two likes.','I like reading. I like walking.','I like reading and walking.','İki beğeniyi birleştir.']],asks:[['Do you like music? Add one detail.','Müziği sever misin? Bir ayrıntı ekle.','Yes, I do. I love music.'],['Do you like football?','Futbolu sever misin?','No, I don’t. I like swimming.'],['What do you like? Name two activities.','Neleri seversin? İki etkinlik söyle.','I like reading and walking.']],gap:['You like reading and walking, but not football. Ask questions to find one activity you both like.','You like swimming and walking, but not reading. Ask questions to find a shared activity.'],gapTr:['Okumayı ve yürümeyi seviyorsun ama futbolu sevmiyorsun. İkinizin de sevdiği bir etkinlik bulmak için soru sor.','Yüzmeyi ve yürümeyi seviyorsun ama okumayı sevmiyorsun. Ortak bir etkinlik için soru sor.'],outcome:'Find the shared activity without reading each other’s cards.',outcomeTr:'Birbirinizin kartını okumadan ortak etkinliği bulun.',exit:['State two likes using and.','State a like and dislike using but.','Ask about a hobby and give a suitable short answer.'],exitTr:['And kullanarak iki beğeni söyle.','But ile bir beğeni ve bir hoşlanmadığın şeyi söyle.','Bir hobi sorusu sor ve uygun kısa cevap ver.'],home:'Interview one imaginary person with three Do you like…? questions.'
},
{
 form:'There is + one thing. / There are + plural. / The… is in/on/under…',formTr:'There is + tek şey. / There are + çoğul. / The… is in/on/under… = … içinde/üstünde/altında.',explain:'There is/are says what exists in a place. The key is… says where a known object is. Match is with one thing and are with more than one.',explainTr:'There is/are bir yerde ne bulunduğunu söyler. The key is… bilinen bir eşyanın yerini söyler. Tek şeyle is, birden fazlayla are kullan.',models:[['There is a table.','Bir masa var.'],['There are two chairs.','İki sandalye var.'],['The key is in my bag.','Anahtar çantamın içinde.']],error:['There is two chairs.','There are two chairs.','Two chairs needs are.','Two chairs ile are kullan.'],build:[['There is a table in the kitchen.','Mutfakta bir masa var.'],['There are two chairs.','İki sandalye var.'],['Where is my phone?','Telefonum nerede?'],['The phone is on the table.','Telefon masanın üstünde.'],['The bag is under the chair.','Çanta sandalyenin altında.'],['The key is in my bag.','Anahtar çantamın içinde.']],changes:[['Change one chair to two.','There is a chair.','There are two chairs.','Bir sandalyeyi iki sandalye yap.'],['Change on to under.','The bag is on the table.','The bag is under the table.','On yerine under kullan.'],['Ask for the phone’s location.','My phone is on the table.','Where is my phone?','Telefonun yerini sor.']],asks:[['What is in the room?','Odada ne var?','There is a table and there are two chairs.'],['Where is the phone?','Telefon nerede?','It’s on the table.'],['Is the key in your bag?','Anahtar çantanın içinde mi?','Yes, it is.']],gap:['You cannot see the objects. Ask where the phone, bag and key are. Draw or place them from your partner’s answers.','Your layout: phone on table, bag under chair, key in bag. Describe the locations without showing the layout.'],gapTr:['Eşyaları göremiyorsun. Telefon, çanta ve anahtarın yerini sor. Cevaplara göre çiz veya yerleştir.','Düzenin: telefon masada, çanta sandalyenin altında, anahtar çantada. Düzeni göstermeden yerleri anlat.'],outcome:'The listener reproduces all three locations correctly.',outcomeTr:'Dinleyen kişi üç eşyanın yerini de doğru yerleştirsin.',exit:['Say what is in a room using There is and There are.','Describe two object locations.','Ask where an object is.'],exitTr:['There is ve There are ile odada ne olduğunu söyle.','İki eşyanın yerini anlat.','Bir eşyanın yerini sor.'],home:'Move a key to three places; describe each position without a written model.'

// Teacher shares this screen. The student speaks; they do not use the file alone.
let stage50=0,stageLessonId=0;
function resetStage(id){if(stageLessonId!==id){stageLessonId=id;stage50=0}}
function enLine(en,tr){return `<div class="phrase"><div><p class="english" lang="en">${esc(en)}</p>${tr?translation(tr):''}</div>${teacherSay(en)}</div>`}
function togetherPanel(l,t){
 resetStage(l.id);
 const s=speaking50[l.id-1];
 const [name,minutes]=route50[stage50];
 const cue=pair('Share your screen. You read the English. The student speaks. Open Türkçe only when they do not understand. Do this together.','Ekranını paylaş. İngilizceyi sen oku. Öğrenci konuşsun. Türkçe’yi yalnızca anlamadığında aç. Bunu birlikte yapın.');
 const rail=`<div class="tabbar" aria-label="50-minute lesson">${route50.map(([n,m],i)=>`<button data-stage="${i}" class="${stage50===i?'active':''}">${i+1}. ${n} · ${m} min</button>`).join('')}</div>`;
 const blocks=[
  ()=>`<article class="card"><h2>Today’s situation</h2>${pair(t.scene,l.scene)}<h2>Sentence frame</h2>${pair(s.form,s.formTr)}<h2>By the end of the lesson</h2>${pair(s.outcome,s.outcomeTr)}</article><article class="card"><h2>Warm up</h2>${pair(t.review,l.review)}<p class="muted">Ask the student to try for one minute. If they cannot, show the frame and try once more.</p>${translation('Bir dakika denesin. Yapamazsa kalıbı göster ve bir kez daha dene.')}</article>`,
  ()=>`<article class="card"><h2>Say the sentence, then change one detail.</h2>${pair('You say the model. The student repeats it. Then change the name, place or number and say it again.','Modeli sen söyle. Öğrenci tekrar etsin. Sonra ad, yer veya sayıyı değiştirip yeniden söylesin.')}${s.models.map(([en,tr])=>enLine(en,tr)).join('')}</article>`,
  ()=>`<article class="card"><h2>Grammar you say aloud</h2>${pair(s.explain,s.explainTr)}<div class="warm"><p class="badge">Fix this sentence</p><p lang="en">${esc(s.error[0])}</p>${translation(s.error[3])}<p class="english" lang="en">${esc(s.error[1])}</p><p>${esc(s.error[2])}</p>${teacherSay(s.error[1])}</div></article>`,
  ()=>`<article class="card"><h2>Build the sentence</h2>${pair('Say each sentence. Then the student says it without reading.','Her cümleyi söyle. Sonra öğrenci okumadan söylesin.')}${s.build.map(([en,tr])=>enLine(en,tr)).join('')}</article><article class="card"><h2>Change one part</h2>${s.changes.map(([instr,from,to,tr])=>`<div class="phrase"><div>${pair(instr,tr)}${enLine(from,'')}<p class="muted">Student says</p>${enLine(to,'')}</div></div>`).join('')}</article>`,
  ()=>`<article class="card"><h2>You ask. The student answers.</h2>${pair('Ask the question. Let the student answer before you open the model.','Soruyu sor. Modeli açmadan önce öğrenci cevap versin.')}${s.asks.map(([q,tr,a])=>`<div class="speak-task">${pair(q,tr)}<details><summary>Show a model answer</summary><p class="english" lang="en">${esc(a)}</p>${teacherSay(a)}</details></div>`).join('')}</article>`,
  ()=>`<article class="card"><h2>Role-play together</h2>${pair(s.gap[0],s.gapTr[0])}<details><summary>Your card</summary>${pair(s.gap[1],s.gapTr[1])}</details><div class="soft">${pair(s.outcome,s.outcomeTr)}</div></article>`,
  ()=>`<article class="card"><h2>Exit check</h2>${pair('The student says these without the model. Help only after the first try.','Öğrenci bunları modele bakmadan söylesin. İlk denemeden sonra yardım et.')}${s.exit.map((en,i)=>enLine(en,s.exitTr[i])).join('')}<div class="warm"><h3>Before the next lesson</h3><p lang="en">${esc(s.home)}</p>${translation('Bunu yalnız ödev olarak verme. Bir sonraki dersten önce birlikte deneyin.')}</div>${teacherChecklist(l)}</article>`
 ];
 return `${cue}${rail}<p class="badge">${name} · ${minutes} min</p>${blocks[stage50]()}<div class="row between section-top"><button data-stage="${Math.max(0,stage50-1)}" ${stage50===0?'disabled':''}>← Previous part</button>${stage50<6?`<button class="primary" data-stage="${stage50+1}">Next part →</button>`:`<button class="primary" data-tab="1">Words, if you still need them →</button>`}</div>`;
}
eslHome=function(){const next=lessons.find(l=>!done(l))||lessons[16];return `<p class="eyebrow">ENGLISH · TEACH THIS TOGETHER</p><section class="hero"><div><h1>One sentence.<br>One new beginning.</h1><p>Seventeen 50-minute lessons. You share the screen. The student speaks with you: grammar, sentences and conversation, not word lists alone.</p><div class="row"><button class="accent" data-lesson="${next.id}">Start lesson ${next.id} →</button><button data-view="plan">My 30-day plan</button></div></div><div class="hero-aside"><div class="progress-ring" style="--p:${completeCount()/17*100}"><div><strong>${completeCount()} / 17</strong><span class="small">lessons complete</span></div></div></div></section><article class="card">${pair('Need help? Click Türkçe next to a word or sentence. Click again to hide the translation.','Yardıma mı ihtiyacın var? Bir kelime veya cümlenin yanındaki Türkçe düğmesine tıkla. Çeviriyi gizlemek için tekrar tıkla.')}${pair('The student does not open this file alone. You lead every part.','Öğrenci bu dosyayı yalnız açmaz. Her bölümü sen yönetirsin.')}<div class="row"><button data-lesson="1" class="primary">Lesson 1</button><button data-assessment="before">Try the first speaking check</button></div></article><div class="stats"><div class="stat"><strong>17</strong><span>50-minute lessons</span></div><div class="stat"><strong>50</strong><span>minutes together</span></div><div class="stat"><strong>7</strong><span>speaking parts in each lesson</span></div></div>`};
eslLesson=function(){const l=lesson(),t=teacherLessons[l.id-1],names=['Together','Words','Phrases','Conversation','Speak','Quiz'];resetStage(l.id);return `<div class="lesson-top"><div><p class="eyebrow">LESSON ${l.id} / 17 · TOGETHER</p><h1>${esc(t.title)}</h1>${translation(l.title)}${pair(t.goal,l.goal)}</div><span class="pill">${done(l)?'✓ Complete':'50 minutes'}</span></div><nav class="tabbar" aria-label="Lesson steps">${names.map((n,i)=>`<button data-tab="${i}" class="${tab===i?'active':''}">${i+1}. ${n}</button>`).join('')}</nav><section class="lesson-panel">${tab===0?togetherPanel(l,t):[eslWords,eslPhrases,eslDialogue,eslSpeak,eslQuiz][tab-1](l,t)}</section><div class="row between section-top"><button data-tab="${Math.max(0,tab-1)}" ${tab===0?'disabled':''}>← Back</button>${tab<5?`<button class="primary" data-tab="${tab+1}">Next →</button>`:l.id<17?`<button data-lesson="${l.id+1}">Next lesson →</button>`:'<button data-assessment="after">Final speaking check →</button>'}</div>`};
eslGuide=function(){return `<h1>How to use this course.</h1><article class="card">${pair('Share your screen for a 50-minute lesson. You read. The student speaks. They do not study this file alone.','50 dakikalık ders için ekranını paylaş. Sen oku. Öğrenci konuşsun. Bu dosyayı yalnız çalışmasın.')}${pair('English stays on screen. Click Türkçe beside any lesson item to show its translation. Click again to hide it.','İngilizce ekranda kalır. Bir ders öğesinin yanındaki Türkçe düğmesine tıklayarak çevirisini göster. Gizlemek için tekrar tıkla.')}${pair('Each lesson has seven parts: warm up, words in sentences, grammar, build sentences, ask and answer, role-play, and an exit check.','Her derste yedi bölüm vardır: ısınma, cümle içinde kelimeler, dilbilgisi, cümle kurma, soru-cevap, rol çalışması ve çıkış kontrolü.')}${pair('Words, phrases, the conversation, extra speaking tasks and the quiz stay available after the together lesson.','Kelimeler, kalıplar, konuşma, ek konuşma görevleri ve test, birlikte dersten sonra durur.')}<p>The course builds early communication skills towards A1. Completion is not a formal language certificate.</p></article>`};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.dataset.stage===undefined||b.disabled)return;e.stopImmediatePropagation();stage50=Number(b.dataset.stage);renderMain()},true);

</script>
